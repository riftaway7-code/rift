    <script>
        (async () => {
            const form = document.getElementById('browser-form');
            const input = document.getElementById('browser-input');
            const frame = document.getElementById('browser-frame');
            const loading = document.getElementById('browser-loading');
            const back = document.getElementById('browser-back');
            const forward = document.getElementById('browser-forward');
            const reload = document.getElementById('browser-reload');
            const more = document.getElementById('browser-more');
            const moreMenu = document.getElementById('browser-more-menu');
            const popout = document.getElementById('browser-popout');
            const panelSwitcher = document.getElementById('panel-switcher');
            const browserShell = document.querySelector('.browser-shell');
            const browserView = document.querySelector('.browser-view');
            const browserHome = document.getElementById('browser-home');
            const consolePanel = document.getElementById('browser-console');
            const consoleStatus = document.getElementById('browser-console-status');
            const consoleOutput = document.getElementById('browser-console-output');
            const consoleInput = document.getElementById('browser-console-input');
            const consoleRun = document.getElementById('browser-console-run');
            const consoleClear = document.getElementById('browser-console-clear');
            const consoleClose = document.getElementById('browser-console-close');
            const HOME_TARGET = 'about:blank';
            let proxyMode = 'scramjet';
            const connection = window.BareMux?.BareMuxConnection
                ? new BareMux.BareMuxConnection('/baremux/worker.js')
                : null;

            if (!form || !input || !frame || !back || !forward || !reload || !more || !moreMenu || !popout || !panelSwitcher || !browserShell || !browserView || !browserHome || !consolePanel || !consoleStatus || !consoleOutput || !consoleInput || !consoleRun || !consoleClear || !consoleClose) return;

            const MAX_PANELS = 3;
            const modeKey = window.location.pathname.startsWith('/nova/') ? 'nova' : 'rift';
            const SESSION_KEY = `${modeKey}__browser-session-v2`;
            const LAST_SESSION_KEY = `${modeKey}__browser-last-session-v2`;
            const HISTORY_KEY = `${modeKey}__browser-history-v1`;
            const BOOKMARKS_KEY = `${modeKey}__browser-bookmarks-v1`;
            const MAX_GLOBAL_HISTORY = 160;
            const MAX_BOOKMARKS = 120;
            const CONSOLE_METHODS = ['log', 'info', 'warn', 'error', 'debug'];
            const panels = [{ history: [], historyIndex: -1 }];
            let activePanel = 0;
            let browserHistory = [];
            let browserBookmarks = [];
            let consoleOpen = false;
            let consoleUrl = HOME_TARGET;

            function formatConsoleValue(value, depth = 0, seen = new WeakSet()) {
                if (value === undefined) return 'undefined';
                if (value === null) return 'null';
                if (typeof value === 'string') return value;
                if (typeof value === 'number' || typeof value === 'boolean' || typeof value === 'bigint') return String(value);
                if (typeof value === 'symbol') return value.toString();
                if (typeof value === 'function') return `[Function ${value.name || 'anonymous'}]`;
                if (value instanceof Error) return value.stack || `${value.name}: ${value.message}`;
                if (typeof Element !== 'undefined' && value instanceof Element) {
                    const id = value.id ? `#${value.id}` : '';
                    const classes = value.classList?.length ? `.${Array.from(value.classList).join('.')}` : '';
                    return `<${String(value.tagName || 'element').toLowerCase()}${id}${classes}>`;
                }
                if (typeof value === 'object') {
                    if (seen.has(value)) return '[Circular]';
                    if (depth >= 2) {
                        if (Array.isArray(value)) return `[Array(${value.length})]`;
                        return `[${value.constructor?.name || 'Object'}]`;
                    }
                    seen.add(value);
                    try {
                        if (Array.isArray(value)) {
                            return `[${value.map((item) => formatConsoleValue(item, depth + 1, seen)).join(', ')}]`;
                        }
                        const entries = Object.entries(value).slice(0, 8).map(([key, entry]) => `${key}: ${formatConsoleValue(entry, depth + 1, seen)}`);
                        const suffix = Object.keys(value).length > 8 ? ', ...' : '';
                        return `{ ${entries.join(', ')}${suffix} }`;
                    } catch {
                        return `[${value.constructor?.name || 'Object'}]`;
                    }
                }
                return String(value);
            }

            function appendConsoleEntry(kind, values, source = '') {
                const row = document.createElement('div');
                row.className = `browser-console-entry ${kind}`;
                const label = source ? `${source}: ` : '';
                const payload = Array.isArray(values)
                    ? values.map((value) => formatConsoleValue(value)).join(' ')
                    : formatConsoleValue(values);
                row.textContent = `${label}${payload}`;
                consoleOutput.appendChild(row);
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
            }

            function setConsoleStatus(message, tone = 'neutral') {
                consoleStatus.textContent = message;
                consoleStatus.dataset.tone = tone;
            }

            function setConsoleOpen(open) {
                consoleOpen = !!open;
                consolePanel.hidden = !consoleOpen;
                browserShell.classList.toggle('browser-console-open', consoleOpen);
            }

            function clearConsoleOutput() {
                consoleOutput.innerHTML = '';
            }

            function getFrameExecutionWindow() {
                const currentSrc = String(frame.getAttribute('src') || frame.src || '');
                if (!currentSrc || currentSrc.includes('about:blank')) return null;
                try {
                    const win = frame.contentWindow;
                    const doc = frame.contentDocument;
                    if (!win || !doc) return null;
                    void doc.body;
                    return win;
                } catch {
                    return null;
                }
            }

            function attachBrowserConsole() {
                const panel = panels[activePanel];
                const current = panel.history[panel.historyIndex] || HOME_TARGET;
                consoleUrl = current;
                if (current === HOME_TARGET) {
                    setConsoleStatus('open a page first, then the console can attach.', 'neutral');
                    return false;
                }
                const targetWindow = getFrameExecutionWindow();
                if (!targetWindow) {
                    setConsoleStatus('console access is unavailable on this page.', 'warn');
                    appendConsoleEntry('warn', ['Console access is blocked for this page. Use proxied pages for inspection.'], 'rift');
                    return false;
                }
                if (targetWindow.__riftBrowserConsoleAttached) {
                    setConsoleStatus(`attached to ${labelForUrl(current)}`, 'ok');
                    return true;
                }

                const sourceConsole = targetWindow.console || {};
                const patchedConsole = targetWindow.console = sourceConsole;
                CONSOLE_METHODS.forEach((method) => {
                    const original = typeof sourceConsole[method] === 'function'
                        ? sourceConsole[method].bind(sourceConsole)
                        : () => {};
                    patchedConsole[method] = (...args) => {
                        appendConsoleEntry(method, args, 'page');
                        return original(...args);
                    };
                });

                targetWindow.addEventListener('error', (event) => {
                    appendConsoleEntry('error', [event.message || 'Script error'], 'page');
                });
                targetWindow.addEventListener('unhandledrejection', (event) => {
                    appendConsoleEntry('error', [event.reason || 'Unhandled promise rejection'], 'page');
                });
                targetWindow.__riftBrowserConsoleAttached = true;
                setConsoleStatus(`attached to ${labelForUrl(current)}`, 'ok');
                appendConsoleEntry('info', [`Console attached to ${current}`], 'rift');
                return true;
            }

            async function runConsoleCode() {
                const code = String(consoleInput.value || '').trim();
                if (!code) return;
                appendConsoleEntry('command', code, 'you');
                const targetWindow = getFrameExecutionWindow();
                if (!targetWindow) {
                    setConsoleStatus('cannot run JavaScript on this page.', 'warn');
                    appendConsoleEntry('error', ['JavaScript runner is unavailable for this page.'], 'rift');
                    return;
                }
                try {
                    const result = targetWindow.eval(code);
                    const awaited = result && typeof result.then === 'function' ? await result : result;
                    appendConsoleEntry('result', [awaited], 'result');
                    setConsoleStatus(`attached to ${labelForUrl(consoleUrl)}`, 'ok');
                } catch (error) {
                    appendConsoleEntry('error', [error], 'result');
                    setConsoleStatus('last run failed. check the console output.', 'warn');
                }
            }

            function readJson(key, fallback) {
                try {
                    const raw = localStorage.getItem(key);
                    return raw ? JSON.parse(raw) : fallback;
                } catch {
                    return fallback;
                }
            }

            function writeJson(key, value) {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                } catch {
                }
            }

            function normalizePanels(raw) {
                if (!Array.isArray(raw) || !raw.length) return [{ history: [], historyIndex: -1 }];
                return raw.slice(0, MAX_PANELS).map((panel) => {
                    const history = Array.isArray(panel?.history)
                        ? panel.history.map((entry) => String(entry || '').trim()).filter(Boolean).slice(-60)
                        : [];
                    let historyIndex = Number(panel?.historyIndex);
                    if (!Number.isFinite(historyIndex)) historyIndex = history.length - 1;
                    if (!history.length) historyIndex = -1;
                    if (historyIndex < -1) historyIndex = -1;
                    if (historyIndex >= history.length) historyIndex = history.length - 1;
                    return { history, historyIndex };
                });
            }

            function persistSession() {
                writeJson(SESSION_KEY, {
                    panels,
                    activePanel,
                    updatedAt: Date.now(),
                });
            }

            function restoreSession() {
                const saved = readJson(SESSION_KEY, null);
                if (!saved?.panels) return;
                const restored = normalizePanels(saved.panels);
                panels.splice(0, panels.length, ...restored);
                const nextActive = Number(saved.activePanel);
                activePanel = Number.isFinite(nextActive) && nextActive >= 0 && nextActive < panels.length ? nextActive : 0;
                writeJson(LAST_SESSION_KEY, saved);
            }

            function labelForUrl(url) {
                try {
                    const parsed = new URL(url, window.location.origin);
                    return String(parsed.hostname || '').replace(/^www\./i, '') || url;
                } catch {
                    return url;
                }
            }

            function loadBookmarks() {
                const rows = readJson(BOOKMARKS_KEY, []);
                browserBookmarks = Array.isArray(rows)
                    ? rows
                        .map((item) => ({
                            url: String(item?.url || '').trim(),
                            label: String(item?.label || '').trim(),
                            at: Number(item?.at || Date.now()),
                        }))
                        .filter((row) => row.url && row.url !== HOME_TARGET)
                        .slice(0, MAX_BOOKMARKS)
                    : [];
            }

            function saveBookmarks() {
                writeJson(BOOKMARKS_KEY, browserBookmarks.slice(0, MAX_BOOKMARKS));
            }

            function loadGlobalHistory() {
                const rows = readJson(HISTORY_KEY, []);
                browserHistory = Array.isArray(rows)
                    ? rows
                        .map((item) => ({
                            url: String(item?.url || '').trim(),
                            at: Number(item?.at || Date.now()),
                        }))
                        .filter((row) => row.url && row.url !== HOME_TARGET)
                        .slice(0, MAX_GLOBAL_HISTORY)
                    : [];
            }

            function saveGlobalHistory() {
                writeJson(HISTORY_KEY, browserHistory.slice(0, MAX_GLOBAL_HISTORY));
            }

            function rememberGlobalHistory(url) {
                const safeUrl = String(url || '').trim();
                if (!safeUrl || safeUrl === HOME_TARGET) return;
                const existing = browserHistory.findIndex((row) => row.url === safeUrl);
                if (existing >= 0) browserHistory.splice(existing, 1);
                browserHistory.unshift({ url: safeUrl, at: Date.now() });
                if (browserHistory.length > MAX_GLOBAL_HISTORY) browserHistory = browserHistory.slice(0, MAX_GLOBAL_HISTORY);
                saveGlobalHistory();
            }

            function saveCurrentBookmark() {
                const panel = panels[activePanel];
                const current = panel.history[panel.historyIndex] || '';
                if (!current || current === HOME_TARGET) return;
                const existing = browserBookmarks.findIndex((row) => row.url === current);
                if (existing >= 0) {
                    browserBookmarks.splice(existing, 1);
                } else {
                    browserBookmarks.unshift({ url: current, label: labelForUrl(current), at: Date.now() });
                    if (browserBookmarks.length > MAX_BOOKMARKS) browserBookmarks = browserBookmarks.slice(0, MAX_BOOKMARKS);
                }
                saveBookmarks();
            }

            function pickAndOpen(rows, heading) {
                if (!rows.length) {
                    alert(`${heading}: empty`);
                    return;
                }
                const maxItems = Math.min(rows.length, 25);
                const listing = rows
                    .slice(0, maxItems)
                    .map((row, idx) => `${idx + 1}. ${row.label || labelForUrl(row.url)}\n   ${row.url}`)
                    .join('\n');
                const pickedRaw = prompt(`${heading}\n\n${listing}\n\nEnter number to open:`);
                if (pickedRaw == null) return;
                const picked = Number.parseInt(String(pickedRaw || '').trim(), 10);
                if (!Number.isFinite(picked) || picked < 1 || picked > maxItems) return;
                const selected = rows[picked - 1];
                if (!selected?.url) return;
                loadTarget(selected.url, true);
                renderPanelSwitcher();
            }

            function newSession() {
                writeJson(LAST_SESSION_KEY, { panels, activePanel, updatedAt: Date.now() });
                panels.splice(0, panels.length, { history: [], historyIndex: -1 });
                activePanel = 0;
                loadTarget(HOME_TARGET, true);
                renderPanelSwitcher();
                persistSession();
            }

            function restoreLastSession() {
                const saved = readJson(LAST_SESSION_KEY, null);
                if (!saved?.panels) return;
                const restored = normalizePanels(saved.panels);
                panels.splice(0, panels.length, ...restored);
                const nextActive = Number(saved.activePanel);
                activePanel = Number.isFinite(nextActive) && nextActive >= 0 && nextActive < panels.length ? nextActive : 0;
                const panel = panels[activePanel];
                const current = panel.history[panel.historyIndex] || HOME_TARGET;
                loadTarget(current, false);
                renderPanelSwitcher();
                persistSession();
            }

            restoreSession();
            loadBookmarks();
            loadGlobalHistory();

            function toTarget(value) {
                const trimmed = value.trim();
                if (!trimmed) return null;

                const hasProtocol = /^https?:\/\//i.test(trimmed);
                const looksLikeDomain = /\.[a-z]{2,}(?:\/|$)/i.test(trimmed);
                const url = hasProtocol
                    ? trimmed
                    : looksLikeDomain
                        ? `https://${trimmed}`
                        : `https://duckduckgo.com/?q=${encodeURIComponent(trimmed)}`;

                return url;
            }

            function mergeTargetUrl(targetUrl, explicitTarget) {
                if (!targetUrl) return targetUrl;
                if (!explicitTarget) return targetUrl;

                try {
                    const target = new URL(targetUrl, window.location.origin);
                    if (!/^https?:$/i.test(target.protocol)) return target.toString();
                    if (target.searchParams.has('target')) return target.toString();

                    const host = (target.hostname || '').toLowerCase();
                    const path = (target.pathname || '').toLowerCase();
                    const isNowggLaunch =
                        (host === 'now.gg' || host.endsWith('.now.gg') || host === 'nowgg.fun' || host.endsWith('.nowgg.fun')) &&
                        path.startsWith('/play/');

                    if (!isNowggLaunch) return target.toString();

                    const resolvedTarget = toTarget(explicitTarget);
                    if (!resolvedTarget) return target.toString();
                    target.searchParams.set('target', resolvedTarget);
                    return target.toString();
                } catch {
                    return targetUrl;
                }
            }

            function updateButtons() {
                const panel = panels[activePanel];
                back.disabled = panel.historyIndex <= 0;
                forward.disabled = panel.historyIndex >= panel.history.length - 1;
            }

            function closeMoreMenu() {
                moreMenu.hidden = true;
            }

            function ensureMoreItem(id, icon, label, handler) {
                let btn = document.getElementById(id);
                if (!btn) {
                    btn = document.createElement('button');
                    btn.type = 'button';
                    btn.id = id;
                    btn.className = 'browser-more-item';
                    btn.innerHTML = `<span class="material-icons">${icon}</span><span>${label}</span>`;
                    moreMenu.appendChild(btn);
                }
                btn.addEventListener('click', (event) => {
                    event.stopPropagation();
                    handler();
                    closeMoreMenu();
                });
                return btn;
            }

            const bookmarkToggleBtn = ensureMoreItem('browser-bookmark-toggle', 'bookmark_add', 'toggle bookmark', () => {
                saveCurrentBookmark();
            });
            ensureMoreItem('browser-open-bookmarks', 'bookmarks', 'bookmarks', () => {
                pickAndOpen(browserBookmarks, 'bookmarks');
            });
            ensureMoreItem('browser-toggle-console', 'terminal', 'console', () => {
                setConsoleOpen(!consoleOpen);
                if (consoleOpen) attachBrowserConsole();
            });
            ensureMoreItem('browser-open-history', 'history', 'history', () => {
                pickAndOpen(browserHistory, 'history');
            });
            ensureMoreItem('browser-clear-history', 'delete_sweep', 'clear history', () => {
                browserHistory = [];
                saveGlobalHistory();
            });
            ensureMoreItem('browser-restore-last-session', 'restore', 'restore session', () => {
                restoreLastSession();
            });
            ensureMoreItem('browser-new-session', 'tab_unselected', 'new session', () => {
                newSession();
            });

            function updateBookmarkToggleLabel() {
                if (!bookmarkToggleBtn) return;
                const panel = panels[activePanel];
                const current = panel.history[panel.historyIndex] || '';
                const isMarked = !!current && current !== HOME_TARGET && browserBookmarks.some((row) => row.url === current);
                bookmarkToggleBtn.innerHTML = `<span class="material-icons">${isMarked ? 'bookmark' : 'bookmark_add'}</span><span>${isMarked ? 'remove bookmark' : 'save bookmark'}</span>`;
            }

            function setLoading(active) {
                if (!loading) return;
                loading.classList.toggle('active', !!active);
            }

            async function ensureTransport() {
                if (!connection) return;
                const wispUrl =
                    (location.protocol === 'https:' ? 'wss' : 'ws') +
                    '://' +
                    location.host +
                    '/wisp/';
                await connection.setTransport('/uv/rift-epoxy.mjs', [{ wisp: wispUrl }]);
                await new Promise((resolve) => setTimeout(resolve, 150));
            }

            async function testWispSocket(timeoutMs = 8000) {
                const wispUrl =
                    (location.protocol === 'https:' ? 'wss' : 'ws') +
                    '://' +
                    location.host +
                    '/wisp/';

                return await new Promise((resolve) => {
                    let settled = false;
                    const socket = new WebSocket(wispUrl, 'wisp-v2');
                    const finish = (ok) => {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timer);
                        try { socket.close(); } catch {}
                        resolve(ok);
                    };
                    const timer = setTimeout(() => finish(false), timeoutMs);
                    socket.addEventListener('open', () => finish(true), { once: true });
                    socket.addEventListener('error', () => finish(false), { once: true });
                    socket.addEventListener('close', () => { if (!settled) finish(false); }, { once: true });
                });
            }

            async function testWispHttp() {
                try {
                    const response = await fetch('/wisp/', {
                        method: 'GET',
                        cache: 'no-store',
                        headers: { 'cache-control': 'no-cache' },
                    });
                    return response.status === 426;
                } catch {
                    return false;
                }
            }

            async function ensureScramjetReady() {
                if (proxyMode !== 'scramjet') return;
                try {
                    if (typeof registerSW === 'function') await registerSW();
                    await ensureTransport();
                    let wispAvailable = await testWispSocket();
                    if (!wispAvailable) wispAvailable = await testWispHttp();
                    if (!wispAvailable) proxyMode = 'proxy';
                } catch {
                    proxyMode = 'proxy';
                }
            }

            function encodeTarget(targetUrl) {
                const encoder = self.__scramjet$bundle?.rewriters?.url?.encodeUrl;
                if (!encoder) return null;
                const base = window.location.origin;
                try {
                    return encoder(targetUrl, base);
                } catch {
                    return null;
                }
            }

            function shouldForcePlainProxy(targetUrl) {
                try {
                    const u = new URL(targetUrl, window.location.origin);
                    const host = (u.hostname || '').toLowerCase();
                    const path = (u.pathname || '').toLowerCase();
                    if (host === 'websitesball.com' || host.endsWith('.websitesball.com')) return true;
                    if (host === 'cdn.jsdelivr.net' && path.startsWith('/gh/gn-math/')) return true;
                    return false;
                } catch {
                    return false;
                }
            }

            function shouldOpenDirect(targetUrl, options = {}) {
                if (options.forceProxy) {
                    return false;
                }
                try {
                    const u = new URL(targetUrl, window.location.origin);
                    const host = (u.hostname || '').toLowerCase();
                    return (
                        host === 'now.gg' ||
                        host.endsWith('.now.gg') ||
                        host === 'websitesball.com' ||
                        host.endsWith('.websitesball.com')
                    );
                } catch {
                    return false;
                }
            }

            function normalizeKnownMirrorTarget(targetUrl) {
                try {
                    const u = new URL(targetUrl, window.location.origin);
                    const host = (u.hostname || '').toLowerCase();
                    const path = (u.pathname || '').toLowerCase();
                    if ((host === 'now.gg' || host.endsWith('.now.gg')) && path === '/apps/a/19900/b.html') {
                        u.hostname = 'websitesball.com';
                        return u.toString();
                    }
                } catch {}
                return targetUrl;
            }

            function buildProxyUrl(targetUrl) {
                try {
                    const u = new URL(targetUrl, window.location.origin);
                } catch {}

                if (shouldForcePlainProxy(targetUrl)) {
                    return `/proxy?url=${encodeURIComponent(targetUrl)}`;
                }

                if (proxyMode === 'scramjet') {
                    const encoded = encodeTarget(targetUrl);
                    if (encoded) return encoded;
                }
                return `/proxy?url=${encodeURIComponent(targetUrl)}`;
            }

            function loadTarget(targetUrl, pushHistory = true, options = {}) {
                if (!targetUrl) {
                    return;
                }
                const resolvedTarget = normalizeKnownMirrorTarget(targetUrl);
                const panel = panels[activePanel];

                const isBlank = resolvedTarget === 'about:blank';
                if (isBlank) {
                    frame.src = 'about:blank';
                    input.value = '';
                    setLoading(false);
                    browserHome.classList.add('active');
                    setConsoleStatus('open a page first, then the console can attach.', 'neutral');
                } else {
                    if (shouldOpenDirect(resolvedTarget, options)) {
                        const popup = window.open(resolvedTarget, '_blank', 'noopener,noreferrer');
                        if (!popup) {
                            window.location.assign(resolvedTarget);
                        }
                        input.value = resolvedTarget;
                        setLoading(false);
                        browserHome.classList.remove('active');
                        setConsoleStatus('direct-open pages cannot be inspected in the embedded console.', 'warn');
                    } else {
                        frame.src = buildProxyUrl(resolvedTarget);
                        input.value = resolvedTarget;
                        setLoading(true);
                        browserHome.classList.remove('active');
                        setConsoleStatus(`connecting to ${labelForUrl(resolvedTarget)}...`, 'neutral');
                    }
                }

                if (pushHistory) {
                    panel.history.splice(panel.historyIndex + 1);
                    panel.history.push(resolvedTarget);
                    if (panel.history.length > 60) panel.history = panel.history.slice(panel.history.length - 60);
                    panel.historyIndex = panel.history.length - 1;
                }

                if (!isBlank) {
                    rememberGlobalHistory(resolvedTarget);
                }

                updateButtons();
                updateBookmarkToggleLabel();
                persistSession();
            }

            function renderPanelSwitcher() {
                panelSwitcher.innerHTML = '';

                panels.forEach((_, index) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'browser-panel-btn' + (index === activePanel ? ' active' : '');
                    btn.setAttribute('aria-label', `Panel ${index + 1}`);
                    btn.title = `Panel ${index + 1}`;
                    btn.innerHTML = `<span class="material-icons">web_asset</span><span class="panel-number">${index + 1}</span>`;
                    btn.addEventListener('click', () => {
                        if (index === activePanel) return;
                        activePanel = index;
                        const panel = panels[activePanel];
                        const current = panel.history[panel.historyIndex] || HOME_TARGET;
                        loadTarget(current, false);
                        renderPanelSwitcher();
                        persistSession();
                    });

                    if (panels.length > 1) {
                        const closeBtn = document.createElement('button');
                        closeBtn.type = 'button';
                        closeBtn.className = 'panel-close-btn';
                        closeBtn.setAttribute('aria-label', `Close panel ${index + 1}`);
                        closeBtn.title = `Close panel ${index + 1}`;
                        closeBtn.innerHTML = '<span class="material-icons">close</span>';
                        closeBtn.addEventListener('click', (event) => {
                            event.stopPropagation();
                            panels.splice(index, 1);
                            if (activePanel >= panels.length) activePanel = panels.length - 1;
                            if (activePanel > index) activePanel -= 1;
                            const panel = panels[activePanel];
                            const current = panel.history[panel.historyIndex] || HOME_TARGET;
                            loadTarget(current, false);
                            renderPanelSwitcher();
                            persistSession();
                        });
                        btn.appendChild(closeBtn);
                    }

                    panelSwitcher.appendChild(btn);
                });

                if (panels.length < MAX_PANELS) {
                    const addBtn = document.createElement('button');
                    addBtn.type = 'button';
                    addBtn.className = 'browser-panel-btn add';
                    addBtn.setAttribute('aria-label', 'Add panel');
                    addBtn.title = 'Add panel';
                    addBtn.innerHTML = '<span class="material-icons">add</span>';
                    addBtn.addEventListener('click', () => {
                        panels.push({ history: [], historyIndex: -1 });
                        activePanel = panels.length - 1;
                        loadTarget(HOME_TARGET, true);
                        renderPanelSwitcher();
                        persistSession();
                    });
                    panelSwitcher.appendChild(addBtn);
                }
            }

            form.addEventListener('submit', (event) => {
                event.preventDefault();
                const target = toTarget(input.value);
                (async () => {
                    if (target && !shouldForcePlainProxy(target) && !shouldOpenDirect(target)) {
                        await ensureScramjetReady();
                    }
                    loadTarget(target, true);
                })();
            });

            back.addEventListener('click', () => {
                const panel = panels[activePanel];
                if (panel.historyIndex <= 0) return;
                panel.historyIndex -= 1;
                loadTarget(panel.history[panel.historyIndex], false);
            });

            forward.addEventListener('click', () => {
                const panel = panels[activePanel];
                if (panel.historyIndex >= panel.history.length - 1) return;
                panel.historyIndex += 1;
                loadTarget(panel.history[panel.historyIndex], false);
            });

            reload.addEventListener('click', () => {
                const panel = panels[activePanel];
                if (panel.historyIndex < 0) return;
                loadTarget(panel.history[panel.historyIndex], false);
            });

            consoleRun.addEventListener('click', () => {
                runConsoleCode();
            });

            consoleInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
                    event.preventDefault();
                    runConsoleCode();
                }
            });

            consoleClear.addEventListener('click', () => {
                clearConsoleOutput();
                attachBrowserConsole();
            });

            consoleClose.addEventListener('click', () => {
                setConsoleOpen(false);
            });

            more.addEventListener('click', (event) => {
                event.stopPropagation();
                moreMenu.hidden = !moreMenu.hidden;
            });

            popout.addEventListener('click', () => {
                const panel = panels[activePanel];
                const target = panel.history[panel.historyIndex] || HOME_TARGET;
                const routed = target === HOME_TARGET ? '' : buildProxyUrl(target);
                const proxyUrl = target === HOME_TARGET
                    ? 'about:blank'
                    : (routed.startsWith('http://') || routed.startsWith('https://') ? routed : `${window.location.origin}${routed}`);
                const popup = window.open('about:blank', '_blank');
                if (!popup) return;

                if (proxyUrl === 'about:blank') {
                    popup.document.write('<!doctype html><title>Rift Browser</title><style>html,body{margin:0;height:100%;background:#0a0a0a;color:#fff;display:grid;place-items:center;font-family:Arial,sans-serif}</style><div>Open a page first, then use Pop out.</div>');
                    popup.document.close();
                    closeMoreMenu();
                    return;
                }

                popup.location.replace(proxyUrl);
                closeMoreMenu();
            });

            document.addEventListener('click', (event) => {
                if (moreMenu.hidden) return;
                if (!moreMenu.contains(event.target) && event.target !== more && !more.contains(event.target)) {
                    closeMoreMenu();
                }
            });

            frame.addEventListener('load', () => {
                if (frame.src.includes('about:blank')) {
                    browserHome.classList.add('active');
                } else {
                    browserHome.classList.remove('active');
                }
                setLoading(false);
                if (consoleOpen) {
                    setTimeout(() => {
                        attachBrowserConsole();
                    }, 120);
                }
            });

            const query = new URLSearchParams(window.location.search);
            const initialUrlParam = query.get('url');
            const initialNowggTarget = query.get('target');
            const initialTarget = initialUrlParam ? mergeTargetUrl(toTarget(initialUrlParam), initialNowggTarget) : null;
            const forceProxy = query.get('forceProxy') === '1';
            const autoPopout = query.get('popout') === '1';
            if (initialTarget && !shouldForcePlainProxy(initialTarget) && !shouldOpenDirect(initialTarget, { forceProxy })) await ensureScramjetReady();
            if (autoPopout && initialTarget) {
                const routed = buildProxyUrl(initialTarget);
                const proxyUrl = routed.startsWith('http://') || routed.startsWith('https://')
                    ? routed
                    : `${window.location.origin}${routed}`;
                window.location.replace(proxyUrl);
                return;
            }
            if (initialTarget) {
                loadTarget(initialTarget, true, { forceProxy });
            } else {
                const panel = panels[activePanel];
                const current = panel.history[panel.historyIndex] || HOME_TARGET;
                const shouldPush = current === HOME_TARGET && panel.historyIndex < 0;
                loadTarget(current, shouldPush);
            }
            renderPanelSwitcher();
            updateBookmarkToggleLabel();
            persistSession();
            setConsoleStatus('open a page first, then the console can attach.', 'neutral');
        })();
    </script>

</body>
