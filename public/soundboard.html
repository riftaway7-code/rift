<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rift Soundboard</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="/global/css/global.css">
    <style>
        body.soundboard-page .container {
            width: min(98vw, 1380px);
            max-width: 1380px;
            margin-left: auto;
            margin-right: auto;
        }
        .soundboard-shell {
            display: grid;
            gap: 14px;
            width: min(96vw, 1300px);
            margin: 0 auto;
        }
        .soundboard-panel {
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 18px;
            background: rgba(255,255,255,.04);
            backdrop-filter: blur(10px);
            padding: 14px;
            min-height: 0;
        }
        .soundboard-toolbar {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) auto auto;
            gap: 8px;
            align-items: center;
        }
        .field,
        .btn {
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.2);
            background: rgba(255,255,255,.05);
            color: #fff;
            padding: 10px 12px;
            font-family: "Run", Arial, sans-serif;
            font-size: 12px;
            outline: none;
        }
        .btn {
            background: rgba(255,255,255,.1);
            cursor: pointer;
            text-transform: lowercase;
        }
        .status {
            margin-top: 8px;
            color: rgba(255,255,255,.68);
            font-size: 11px;
            min-height: 16px;
        }
        .soundboard-layout {
            margin-top: 12px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(340px, 420px);
            gap: 14px;
            min-height: min(68vh, 760px);
        }
        .soundboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            align-content: start;
            max-height: min(68vh, 760px);
            overflow: auto;
        }
        .sound-card {
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;
            background: rgba(255,255,255,.04);
            padding: 12px;
            display: grid;
            gap: 10px;
            min-height: 132px;
        }
        .sound-card.active {
            border-color: rgba(167,216,255,.46);
            box-shadow: 0 0 0 1px rgba(167,216,255,.16) inset;
        }
        .sound-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }
        .sound-card-title {
            color: #fff;
            font-size: 12px;
            line-height: 1.4;
            word-break: break-word;
        }
        .sound-card-sub {
            color: rgba(255,255,255,.58);
            font-size: 10px;
            margin-top: 4px;
            text-transform: lowercase;
            letter-spacing: .05em;
        }
        .sound-card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .sound-btn,
        .sound-link {
            border: 1px solid rgba(255,255,255,.16);
            background: rgba(255,255,255,.08);
            color: #fff;
            border-radius: 10px;
            padding: 8px 10px;
            cursor: pointer;
            font-family: "Run", Arial, sans-serif;
            font-size: 10px;
            text-transform: lowercase;
            letter-spacing: .04em;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .sound-btn.primary {
            min-width: 92px;
            background: rgba(167,216,255,.16);
            border-color: rgba(167,216,255,.26);
        }
        .sound-preview {
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;
            background: rgba(255,255,255,.04);
            overflow: hidden;
            min-height: 0;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
        }
        .sound-preview-head {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            display: grid;
            gap: 8px;
        }
        .sound-preview-title {
            color: #fff;
            font-size: 13px;
            line-height: 1.35;
        }
        .sound-preview-sub {
            color: rgba(255,255,255,.6);
            font-size: 10px;
            text-transform: lowercase;
            letter-spacing: .05em;
        }
        .sound-preview-frame {
            width: 100%;
            height: 100%;
            min-height: 420px;
            border: 0;
            background: rgba(0,0,0,.25);
        }
        .sound-preview-empty {
            padding: 24px;
            color: rgba(255,255,255,.64);
            font-size: 12px;
            text-align: center;
        }
        .sound-empty {
            border: 1px dashed rgba(255,255,255,.16);
            border-radius: 14px;
            padding: 24px;
            color: rgba(255,255,255,.62);
            font-size: 12px;
            text-align: center;
            grid-column: 1 / -1;
        }
        @media (max-width: 920px) {
            .soundboard-toolbar,
            .soundboard-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="soundboard-page">
    <div class="container">
        <header>
            <h1>rift soundboard</h1>
            <p class="page-subtitle">browse and preview sound buttons in a dedicated page</p>
        </header>

        <section class="soundboard-shell">
            <article class="soundboard-panel">
                <form id="soundboardSearchForm" class="soundboard-toolbar">
                    <input id="soundboardSearchInput" class="field" placeholder="filter loaded sound buttons" autocomplete="off">
                    <button id="soundboardReloadBtn" class="btn" type="button">reload</button>
                    <button class="btn" type="submit">filter</button>
                </form>
                <div id="soundboardStatus" class="status">Load sound buttons from Sound Buttons World and SoundButtonsPro.</div>
                <div class="soundboard-layout">
                    <div id="soundboardResults" class="soundboard-grid"></div>
                    <aside class="sound-preview">
                        <div class="sound-preview-head">
                            <div id="soundPreviewTitle" class="sound-preview-title">No sound selected</div>
                            <div id="soundPreviewMeta" class="sound-preview-sub">select a sound card to open its page here</div>
                            <div class="sound-card-actions">
                                <a id="soundPreviewOpen" class="sound-link" href="https://soundbuttonsworld.com/" target="_blank" rel="noopener noreferrer">
                                    <span class="material-icons">open_in_new</span>
                                    <span>open source</span>
                                </a>
                            </div>
                        </div>
                        <div id="soundPreviewEmpty" class="sound-preview-empty">Pick a sound from the list and Rift will load the sound page here.</div>
                        <iframe id="soundPreviewFrame" class="sound-preview-frame" title="Soundboard preview" hidden></iframe>
                    </aside>
                </div>
            </article>
        </section>
    </div>

        </button>
        <button class="nav-button" onclick="location.href='/apps'">

        <button class="nav-button" onclick="location.href='/music'">

        </button>
        <button class="nav-button active" onclick="location.href='/soundboard'">
            <span class="material-icons">graphic_eq</span>
        </button>
        <button class="nav-button" onclick="location.href='/chat'">
            <span class="material-icons">forum</span>
        </button>
        <button class="nav-button" onclick="location.href='/browser'">

        <button class="nav-button" onclick="location.href='/account'">
            <span class="material-icons">person</span>
        </button>
        <button class="nav-button" onclick="location.href='/settings'">

        </button>
        <button class="nav-button" onclick="location.href='/social-media-&-partners'">
            <span class="material-icons">connect_without_contact</span>
        </button>
        <button class="nav-button" onclick="location.href='/rift_media'">
            <span class="material-icons">movie</span>
        </button>
        <button class="nav-button" onclick="location.href='/os'">

    </nav>

    <script>
        document.body.classList.add('nav-pos-' + (localStorage.getItem('rift__nav-position') || 'bottom'));
    </script>
    <script src="/global/js/global.js"></script>
    <script src="/components/cloaker.js"></script>
    <script src="/components/overlay.js"></script>
    <script src="/components/components.js"></script>
    <script src="/components/404.js"></script>
    <script>
        const soundboardSearchForm = document.getElementById('soundboardSearchForm');
        const soundboardSearchInput = document.getElementById('soundboardSearchInput');
        const soundboardReloadBtn = document.getElementById('soundboardReloadBtn');
        const soundboardStatus = document.getElementById('soundboardStatus');
        const soundboardResults = document.getElementById('soundboardResults');
        const soundPreviewTitle = document.getElementById('soundPreviewTitle');
        const soundPreviewMeta = document.getElementById('soundPreviewMeta');
        const soundPreviewOpen = document.getElementById('soundPreviewOpen');
        const soundPreviewEmpty = document.getElementById('soundPreviewEmpty');
        const soundPreviewFrame = document.getElementById('soundPreviewFrame');

        const SOUNDBOARD_SOURCES = [
            {
                key: 'world',
                name: 'Sound Buttons World',
                base: 'https://soundbuttonsworld.com',
                entryPattern: /\/sound-button\//i,
                pages: [
                    { path: '/', section: 'home' },
                    { path: '/trends', section: 'trending' },
                    { path: '/new', section: 'new' },
                    { path: '/categories/memes%20soundboard', section: 'memes' },
                    { path: '/categories/movies%20soundboard', section: 'movies' },
                    { path: '/categories/reactions%20soundboard', section: 'reactions' },
                    { path: '/categories/sound%20effects%20soundboard', section: 'sound effects' },
                    { path: '/categories/voice%20record%20soundboard', section: 'voice record' },
                    { path: '/categories/creativity%20soundboard', section: 'creativity' },
                    { path: '/categories/anime%20soundboard', section: 'anime' },
                    { path: '/categories/games%20soundboard', section: 'games' },
                ],
            },
            {
                key: 'pro',
                name: 'SoundButtonsPro',
                base: 'https://soundbuttonspro.com',
                entryPattern: /-soundboard\/?$/i,
                pages: [
                    { path: '/', section: 'home' },
                    { path: '/new-sound-buttons/', section: 'new' },
                    { path: '/popular-sound-buttons/', section: 'popular' },
                    { path: '/trending-sound-buttons/', section: 'trending' },
                    { path: '/memes-sound-buttons/', section: 'memes' },
                    { path: '/pranks-sound-buttons/', section: 'pranks' },
                    { path: '/movies-television-sound-buttons/', section: 'movies & television' },
                    { path: '/games-sound-buttons/', section: 'games' },
                    { path: '/sound-effects-sound-buttons/', section: 'sound effects' },
                    { path: '/tiktok-sound-buttons/', section: 'tiktok' },
                    { path: '/anime-sound-buttons/', section: 'anime' },
                    { path: '/reactions-sound-buttons/', section: 'reactions' },
                    { path: '/politics-sound-buttons/', section: 'politics' },
                    { path: '/sports-sound-buttons/', section: 'sports' },
                ],
            },
        ];

        const state = {
            clips: [],
            filteredClips: [],
            selectedClipId: '',
            loaded: false,
        };

        function setSoundboardStatus(text) {
            soundboardStatus.textContent = text || '';
        }

        function escapeHtml(text) {
            return String(text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function proxyUrlFor(target) {
            return `/proxy?url=${encodeURIComponent(target)}`;
        }

        function unwrapProxyUrl(raw) {
            const value = String(raw || '').trim();
            if (!value) return '';
            try {
                const absolute = new URL(value, window.location.origin);
                if (absolute.pathname === '/proxy') {
                    return absolute.searchParams.get('url') || '';
                }
                return absolute.href;
            } catch {
                return value;
            }
        }

        function normalizeSoundboardUrl(raw, base) {
            const value = unwrapProxyUrl(raw);
            if (!value) return '';
            try {
                return new URL(value, base).href;
            } catch {
                return '';
            }
        }

        async function fetchHtml(url) {
            const res = await fetch(url, { credentials: 'same-origin' });
            if (!res.ok) throw new Error(`request failed (${res.status})`);
            return await res.text();
        }

        function parseHtml(html) {
            return new DOMParser().parseFromString(String(html || ''), 'text/html');
        }

        function collectSoundboardCandidates(html, source, fallbackSection) {
            const doc = parseHtml(html);
            const seen = new Set();
            const items = [];
            doc.querySelectorAll('a[href]').forEach((anchor) => {
                const href = String(anchor.getAttribute('href') || '').trim();
                const absolute = normalizeSoundboardUrl(href, source.base);
                if (!absolute || !source.entryPattern.test(absolute) || seen.has(absolute)) return;
                seen.add(absolute);
                const title = String(anchor.textContent || '').replace(/\s+/g, ' ').trim();
                if (!title) return;
                const sectionHeading = anchor.closest('section, div, article')?.previousElementSibling?.textContent || '';
                items.push({
                    title,
                    pageUrl: absolute,
                    proxiedPageUrl: proxyUrlFor(absolute),
                    section: String(sectionHeading || '').replace(/\s+/g, ' ').trim().toLowerCase() || fallbackSection,
                    source: source.name,
                    sourceKey: source.key,
                });
            });
            return items.slice(0, 48);
        }

        function renderSoundboardResults() {
            if (!state.filteredClips.length) {
                soundboardResults.innerHTML = `<div class="sound-empty">${state.loaded ? 'No loaded sounds matched that filter.' : 'No soundboard clips loaded yet.'}</div>`;
                return;
            }

            soundboardResults.innerHTML = state.filteredClips.map((clip, index) => `
                <article class="sound-card ${clip.id === state.selectedClipId ? 'active' : ''}">
                    <div class="sound-card-top">
                        <div>
                            <div class="sound-card-title">${escapeHtml(clip.title)}</div>
                            <div class="sound-card-sub">${escapeHtml(`${clip.source || 'soundboard'} · ${clip.section || 'collection'}`)}</div>
                        </div>
                        <button class="sound-btn primary" type="button" data-sound-open="${index}">
                            <span class="material-icons">${clip.id === state.selectedClipId ? 'visibility' : 'open_in_browser'}</span>
                            <span>${clip.id === state.selectedClipId ? 'viewing' : 'open'}</span>
                        </button>
                    </div>
                    <div class="sound-card-actions">
                        <a class="sound-link" href="${escapeHtml(clip.pageUrl)}" target="_blank" rel="noopener noreferrer">
                            <span class="material-icons">open_in_new</span>
                            <span>source</span>
                        </a>
                    </div>
                </article>
            `).join('');

            soundboardResults.querySelectorAll('[data-sound-open]').forEach((button) => {
                button.addEventListener('click', () => {
                    const index = Number(button.getAttribute('data-sound-open'));
                    const clip = state.filteredClips[index];
                    if (!clip) return;
                    selectClip(clip);
                });
            });
        }

        function selectClip(clip) {
            state.selectedClipId = clip.id;
            soundPreviewTitle.textContent = clip.title || 'Sound preview';
            soundPreviewMeta.textContent = `${clip.source || 'soundboard'} · ${clip.section || 'collection'}`;
            soundPreviewOpen.href = clip.pageUrl || SOUNDBOARD_SOURCES[0].base;
            soundPreviewEmpty.hidden = true;
            soundPreviewFrame.hidden = false;
            soundPreviewFrame.src = clip.proxiedPageUrl || proxyUrlFor(clip.pageUrl);
            renderSoundboardResults();
            setSoundboardStatus(`Opened ${clip.title} from Sound Buttons World.`);
        }

        function applyFilter(query) {
            const normalized = String(query || '').trim().toLowerCase();
            state.filteredClips = state.clips.filter((clip) => {
                if (!normalized) return true;
                const hay = `${clip.title || ''} ${clip.section || ''} ${clip.source || ''}`.toLowerCase();
                return hay.includes(normalized);
            });
            if (!state.filteredClips.some((clip) => clip.id === state.selectedClipId)) {
                state.selectedClipId = '';
            }
            renderSoundboardResults();
        }

        async function loadClips(query = '') {
            const normalized = String(query || '').trim().toLowerCase();
            setSoundboardStatus(normalized ? `Searching Sound Buttons World pages for "${normalized}"...` : 'Loading Sound Buttons World sounds...');

            const settled = await Promise.allSettled(
                SOUNDBOARD_SOURCES.flatMap((source) =>
                    source.pages.map(async (page) => {
                        const absoluteUrl = `${source.base}${page.path}`;
                        const html = await fetchHtml(proxyUrlFor(absoluteUrl));
                        return collectSoundboardCandidates(html, source, page.section);
                    })
                )
            );

            const deduped = [];
            const seen = new Set();
            for (const result of settled) {
                if (result.status !== 'fulfilled' || !Array.isArray(result.value)) continue;
                for (const clip of result.value) {
                    const key = String(clip.pageUrl || '').trim().toLowerCase();
                    if (!key || seen.has(key)) continue;
                    seen.add(key);
                    deduped.push(clip);
                }
            }

            state.clips = deduped.map((clip, index) => ({
                id: `${clip.sourceKey || 'sound'}:${index}:${clip.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 36) || index}`,
                ...clip,
            }));
            state.loaded = true;
            state.selectedClipId = '';
            soundPreviewTitle.textContent = 'No sound selected';
            soundPreviewMeta.textContent = 'select a sound card to open its page here';
            soundPreviewOpen.href = SOUNDBOARD_SOURCES[0].base;
            soundPreviewFrame.hidden = true;
            soundPreviewFrame.src = 'about:blank';
            soundPreviewEmpty.hidden = false;

            applyFilter(normalized);
            setSoundboardStatus(state.filteredClips.length
                ? `Loaded ${state.filteredClips.length} sounds from both soundboard sources.`
                : 'No sounds matched that filter.');
        }

        soundboardSearchForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!state.loaded) {
                await loadClips(soundboardSearchInput.value);
                return;
            }
            applyFilter(soundboardSearchInput.value);
            setSoundboardStatus(state.filteredClips.length
                ? `Showing ${state.filteredClips.length} filtered sounds.`
                : 'No loaded sounds matched that filter.');
        });

        soundboardReloadBtn.addEventListener('click', async () => {
            await loadClips(soundboardSearchInput.value);
        });

        (async () => {
            renderSoundboardResults();
            try {
                await loadClips('');
            } catch (error) {
                setSoundboardStatus(error.message || 'soundboard load failed');
            }
        })();
    </script>

    <script src="/global/js/ads.js"></script>
