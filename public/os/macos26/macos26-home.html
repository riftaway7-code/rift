      };

      function setRunning(item, isActive) {
        item.classList.toggle("active", isActive);
      }

      function getWidgetLayerRect() {
        return desktopWidgetsLayer.getBoundingClientRect();
      }

      function closeWidgetsPanel() {
        widgetsPanel.classList.remove("open");
        widgetsPanel.setAttribute("aria-hidden", "true");
      }

      function focusDesktopWidget(entry) {
        widgetZSeed += 1;
        entry.el.style.zIndex = String(widgetZSeed);
      }

      function normalizeWidgetPosition(left, top, widgetEl) {
        const layer = getWidgetLayerRect();
        const w = widgetEl.offsetWidth || 230;
        const h = widgetEl.offsetHeight || 120;
        const maxLeft = Math.max(0, layer.width - w);
        const maxTop = Math.max(0, layer.height - h);
        return {
          left: clamp(Math.round(left), 0, maxLeft),
          top: clamp(Math.round(top), 0, maxTop)
        };
      }

      function persistDesktopWidgets() {
        const payload = [];
        desktopWidgetState.forEach((entry) => {
          payload.push({
            id: entry.id,
            left: Math.round(entry.left),
            top: Math.round(entry.top)
          });
        });
        try {
          window.localStorage.setItem("macos26_desktop_widgets", JSON.stringify(payload));
        } catch {}
      }

      function renderDesktopWidgetBody(entry) {
        const body = entry.el.querySelector(".desktop-widget-body");
        if (!body) {
          return;
        }
        if (entry.id === "weather") {
          const temp = Number.isFinite(weatherState.tempF) ? `${Math.round(weatherState.tempF)}°F` : "--°F";
          const condition = weatherState.condition || "Fetching weather…";
          body.innerHTML = `
            <div class="widget-weather-temp">${temp}</div>
            <div class="widget-weather-meta">${condition}</div>
            <div class="widget-weather-meta">${locationState.label || "Default"}</div>
          `;
          return;
        }
        if (entry.id === "clock") {
          body.innerHTML = `
            <div class="widget-clock-time">${timeFmt.format(new Date())}</div>
            <div class="widget-clock-date">${dateFmt.format(new Date())}</div>
          `;
          return;
        }
        body.innerHTML = `<div class="widget-weather-meta">Widget unavailable.</div>`;
      }

      function refreshDesktopWidgets() {
        desktopWidgetState.forEach((entry) => renderDesktopWidgetBody(entry));
        if (widgetsPanel.classList.contains("open")) {
          renderWidgetsPanelList();
        }
      }

      function defaultWidgetPosition() {
        const layer = getWidgetLayerRect();
        const index = desktopWidgetState.size;
        const left = Math.max(10, layer.width - 250);
        const top = 10 + (index % 5) * 128;
        return { left, top };
      }

      function removeDesktopWidget(widgetId) {
        const entry = desktopWidgetState.get(widgetId);
        if (!entry) {
          return;
        }
        entry.el.remove();
        desktopWidgetState.delete(widgetId);
        persistDesktopWidgets();
        renderWidgetsPanelList();
      }

      function startDesktopWidgetDrag(event, widgetId) {
        if (event.button !== 0 || event.target.closest(".desktop-widget-close")) {
          return;
        }
        const entry = desktopWidgetState.get(widgetId);
        if (!entry) {
          return;
        }
        const layer = getWidgetLayerRect();
        const rect = entry.el.getBoundingClientRect();
        const offsetX = event.clientX - rect.left;
        const offsetY = event.clientY - rect.top;
        const width = rect.width;
        const height = rect.height;
        entry.el.classList.add("dragging");
        focusDesktopWidget(entry);
        event.preventDefault();

        const onMove = (moveEvent) => {
          const nextLeft = clamp(moveEvent.clientX - offsetX - layer.left, 0, Math.max(0, layer.width - width));
          const nextTop = clamp(moveEvent.clientY - offsetY - layer.top, 0, Math.max(0, layer.height - height));
          entry.left = nextLeft;
          entry.top = nextTop;
          entry.el.style.left = `${nextLeft}px`;
          entry.el.style.top = `${nextTop}px`;
        };

        const onUp = () => {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
          entry.el.classList.remove("dragging");
          persistDesktopWidgets();
          renderWidgetsPanelList();
        };

        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
      }

      function addWidgetToDesktop(widgetId, initialPos = null, persist = true) {
        const existing = desktopWidgetState.get(widgetId);
        if (existing) {
          focusDesktopWidget(existing);
          existing.el.animate(
            [{ transform: "scale(1)" }, { transform: "scale(1.03)" }, { transform: "scale(1)" }],
            { duration: 180, easing: "ease-out" }
          );
          return existing;
        }

        const def = widgetCatalog.find((item) => item.id === widgetId);
        if (!def) {
          return null;
        }

        const widget = document.createElement("article");
        widget.className = "desktop-widget";
        widget.dataset.widgetId = def.id;
        widget.innerHTML = `
          <div class="desktop-widget-head">
            <span class="desktop-widget-title">${def.name}</span>
            <button class="desktop-widget-close" type="button" aria-label="Remove widget">×</button>
          </div>
          <div class="desktop-widget-body"></div>
        `;
        desktopWidgetsLayer.appendChild(widget);

        const start = initialPos || defaultWidgetPosition();
        const pos = normalizeWidgetPosition(start.left, start.top, widget);
        widget.style.left = `${pos.left}px`;
        widget.style.top = `${pos.top}px`;

        const entry = { id: def.id, el: widget, left: pos.left, top: pos.top };
        desktopWidgetState.set(def.id, entry);
        focusDesktopWidget(entry);

        widget.querySelector(".desktop-widget-head")?.addEventListener("mousedown", (event) => startDesktopWidgetDrag(event, def.id));
        widget.querySelector(".desktop-widget-close")?.addEventListener("click", (event) => {
          event.stopPropagation();
          removeDesktopWidget(def.id);
        });
        widget.addEventListener("mousedown", () => focusDesktopWidget(entry));

        renderDesktopWidgetBody(entry);
        if (persist) {
          persistDesktopWidgets();
        }
        renderWidgetsPanelList();
        return entry;
      }

      function restoreDesktopWidgets() {
        let restored = false;
        try {
          const raw = window.localStorage.getItem("macos26_desktop_widgets");
          if (!raw) {
            return;
          }
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) {
            return;
          }
          parsed.forEach((item) => {
            if (!item || typeof item.id !== "string") {
              return;
            }
            addWidgetToDesktop(item.id, { left: Number(item.left) || 0, top: Number(item.top) || 0 }, false);
            restored = true;
          });
        } catch {}
        if (restored) {
          persistDesktopWidgets();
        }
      }

      function renderWidgetsPanelList() {
        if (!widgetsPanelList) {
          return;
        }
        widgetsPanelList.innerHTML = "";
        widgetCatalog.forEach((def) => {
          const placed = desktopWidgetState.has(def.id);
          const row = document.createElement("article");
          row.className = "widgets-panel-item";
          row.innerHTML = `
            <div class="widgets-panel-row">
              <p class="widgets-panel-name">${def.name}</p>
              <button type="button" class="widgets-panel-action">${placed ? "Focus" : "Add to Desktop"}</button>
            </div>
            <p class="widgets-panel-desc">${def.description()}</p>
          `;
          row.querySelector(".widgets-panel-action")?.addEventListener("click", () => {
            const entry = addWidgetToDesktop(def.id);
            if (entry) {
              closeWidgetsPanel();
            }
          });
          widgetsPanelList.appendChild(row);
        });
      }

      function openWidgetsPanelAt(x, y) {
        renderWidgetsPanelList();
        widgetsPanel.classList.add("open");
        widgetsPanel.setAttribute("aria-hidden", "false");
        widgetsPanel.style.left = `${x}px`;
        widgetsPanel.style.top = `${y}px`;
        requestAnimationFrame(() => {
          const pad = 8;
          const rect = widgetsPanel.getBoundingClientRect();
          const left = Math.min(Math.max(pad, x), window.innerWidth - rect.width - pad);
          const top = Math.min(Math.max(pad, y), window.innerHeight - rect.height - pad);
          widgetsPanel.style.left = `${left}px`;
          widgetsPanel.style.top = `${top}px`;
        });
      }

      function keepDesktopWidgetsInBounds() {
        desktopWidgetState.forEach((entry) => {
          const pos = normalizeWidgetPosition(entry.left, entry.top, entry.el);
          entry.left = pos.left;
          entry.top = pos.top;
          entry.el.style.left = `${pos.left}px`;
          entry.el.style.top = `${pos.top}px`;
        });
        persistDesktopWidgets();
      }

      function formatWeatherLabel(label) {
        const clean = (label || "Default").trim();
        const shortLabel = clean.length > 18 ? `${clean.slice(0, 18)}…` : clean;
        const temp = Number.isFinite(weatherState.tempF) ? `${Math.round(weatherState.tempF)}°F` : "--°F";
        return `${temp} · ${shortLabel}`;
      }

      function weatherCodeToLabel(code) {
        if (code === 0) return "Clear";
        if ([1, 2].includes(code)) return "Partly Cloudy";
        if (code === 3) return "Cloudy";
        if ([45, 48].includes(code)) return "Fog";
        if ([51, 53, 55, 56, 57].includes(code)) return "Drizzle";
        if ([61, 63, 65, 66, 67].includes(code)) return "Rain";
        if ([71, 73, 75, 77].includes(code)) return "Snow";
        if ([80, 81, 82].includes(code)) return "Showers";
        if ([85, 86].includes(code)) return "Snow Showers";
        if ([95, 96, 99].includes(code)) return "Thunderstorm";
        return "Weather";
      }

      async function fetchWeatherByCoords(latitude, longitude) {
        const url = new URL("https://api.open-meteo.com/v1/forecast");
        url.searchParams.set("latitude", String(latitude));
        url.searchParams.set("longitude", String(longitude));
        url.searchParams.set("current", "temperature_2m,weather_code");
        url.searchParams.set("temperature_unit", "fahrenheit");
        const response = await fetch(url.toString(), { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Weather fetch failed (${response.status})`);
        }
        const data = await response.json();
        const current = data?.current;
        if (!current || !Number.isFinite(current.temperature_2m)) {
          throw new Error("No current weather");
        }
        return {
          tempF: Number(current.temperature_2m),
          condition: weatherCodeToLabel(Number(current.weather_code))
        };
      }

      async function geocodeCity(city) {
        const url = new URL("https://geocoding-api.open-meteo.com/v1/search");
        url.searchParams.set("name", city);
        url.searchParams.set("count", "1");
        url.searchParams.set("language", "en");
        url.searchParams.set("format", "json");
        const response = await fetch(url.toString(), { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Geocode failed (${response.status})`);
        }
        const data = await response.json();
        const first = data?.results?.[0];
        if (!first || !Number.isFinite(first.latitude) || !Number.isFinite(first.longitude)) {
          throw new Error("City not found");
        }
        return { latitude: Number(first.latitude), longitude: Number(first.longitude) };
      }

      function updateWeatherLabel() {
        if (menuWeather) {
          menuWeather.textContent = formatWeatherLabel(locationState.label);
        }
        refreshDesktopWidgets();
      }

      async function refreshWeatherForLocation() {
        try {
          let latitude = locationState.latitude;
          let longitude = locationState.longitude;
          if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
            if (locationState.mode === "city" && locationState.label && locationState.label !== "Default") {
              const coords = await geocodeCity(locationState.label);
              latitude = coords.latitude;
              longitude = coords.longitude;
              locationState.latitude = latitude;
              locationState.longitude = longitude;
              try {
                window.localStorage.setItem("macos26_widget_location_lat", String(latitude));
                window.localStorage.setItem("macos26_widget_location_lon", String(longitude));
              } catch {}
            } else {
              updateWeatherLabel();
              return;
            }
          }
          const weather = await fetchWeatherByCoords(latitude, longitude);
          weatherState.tempF = weather.tempF;
          weatherState.condition = weather.condition;
          updateWeatherLabel();
        } catch {
          updateWeatherLabel();
        }
      }

      function applyWeatherLocation(mode, label, persist = true, coords = null) {
        locationState.mode = mode || "default";
        locationState.label = (label || "Default").trim() || "Default";
        locationState.latitude = Number.isFinite(coords?.latitude) ? Number(coords.latitude) : null;
        locationState.longitude = Number.isFinite(coords?.longitude) ? Number(coords.longitude) : null;
        updateWeatherLabel();
        if (persist) {
          try {
            window.localStorage.setItem("macos26_widget_location_mode", locationState.mode);
            window.localStorage.setItem("macos26_widget_location_label", locationState.label);
            if (Number.isFinite(locationState.latitude) && Number.isFinite(locationState.longitude)) {
              window.localStorage.setItem("macos26_widget_location_lat", String(locationState.latitude));
              window.localStorage.setItem("macos26_widget_location_lon", String(locationState.longitude));
            } else {
              window.localStorage.removeItem("macos26_widget_location_lat");
              window.localStorage.removeItem("macos26_widget_location_lon");
            }
          } catch {}
        }
        refreshWeatherForLocation();
      }

      function restoreLocationPreference() {
        try {
          const mode = window.localStorage.getItem("macos26_widget_location_mode");
          const label = window.localStorage.getItem("macos26_widget_location_label");
          const lat = Number(window.localStorage.getItem("macos26_widget_location_lat"));
          const lon = Number(window.localStorage.getItem("macos26_widget_location_lon"));
          if (mode && label) {
            applyWeatherLocation(
              mode,
              label,
              false,
              Number.isFinite(lat) && Number.isFinite(lon) ? { latitude: lat, longitude: lon } : null
            );
            return;
          }
        } catch {}
        applyWeatherLocation("default", "Default", false);
      }

      function formatCoordsLabel(latitude, longitude) {
        const latAbs = Math.abs(latitude).toFixed(2);
        const lonAbs = Math.abs(longitude).toFixed(2);
        const latH = latitude >= 0 ? "N" : "S";
        const lonH = longitude >= 0 ? "E" : "W";
        return `${latAbs}°${latH}, ${lonAbs}°${lonH}`;
      }

      function getDockItem(appId) {
        return dockItems.find((item) => item.dataset.app === appId) || null;
      }

      function networkPrimaryLabel() {
        if (!networkState.online) {
          return "Off";
        }
        const type = (networkState.type || "").toLowerCase();
        if (type === "wifi" || type === "wlan") {
          return "Connected";
        }
        if (type === "ethernet") {
          return "Ethernet";
        }
        if (type === "cellular") {
          return `Cellular ${networkState.effectiveType || ""}`.trim();
        }
        if (networkState.effectiveType) {
          return `Online ${networkState.effectiveType.toUpperCase()}`;
        }
        return "Online";
      }

      function networkMenuLabel() {
        const status = networkPrimaryLabel();
        if (status === "Connected") {
          return "Wi-Fi Connected";
        }
        if (status === "Off") {
          return "Wi-Fi Off";
        }
        return `Wi-Fi (${status})`;
      }

      function readNetworkState() {
        networkState.online = Boolean(navigator.onLine);
        if (!networkConnection) {
          return;
        }
        networkState.type = typeof networkConnection.type === "string" ? networkConnection.type : null;
        networkState.effectiveType = typeof networkConnection.effectiveType === "string" ? networkConnection.effectiveType : null;
        networkState.downlink = Number.isFinite(networkConnection.downlink) ? Number(networkConnection.downlink) : null;
        networkState.rtt = Number.isFinite(networkConnection.rtt) ? Number(networkConnection.rtt) : null;
      }

      function updateWifiLabel() {
        if (menuWifi) {
          menuWifi.textContent = networkMenuLabel();
        }
      }

      function batteryIcon(level, charging) {
        if (!Number.isFinite(level)) {
          return "🔋";
        }
        if (charging) {
          return "⚡";
        }
        return level <= 0.2 ? "🪫" : "🔋";
      }

      function batteryMenuLabel() {
        const icon = batteryIcon(batteryState.level, batteryState.charging);
        if (!batteryState.supported || !Number.isFinite(batteryState.level)) {
          return `${icon} --%`;
        }
        return `${icon} ${Math.round(batteryState.level * 100)}%`;
      }

      function updateBatteryLabel() {
        if (menuBattery) {
          menuBattery.textContent = batteryMenuLabel();
        }
      }

      function readBatteryStateFromApi() {
        if (!batteryApi) {
          return;
        }
        batteryState.supported = true;
        batteryState.level = Number.isFinite(batteryApi.level) ? Number(batteryApi.level) : null;
        batteryState.charging = typeof batteryApi.charging === "boolean" ? batteryApi.charging : null;
        batteryState.chargingTime = Number.isFinite(batteryApi.chargingTime) ? Number(batteryApi.chargingTime) : null;
        batteryState.dischargingTime = Number.isFinite(batteryApi.dischargingTime) ? Number(batteryApi.dischargingTime) : null;
      }

      async function initBatteryStatus() {
        if (typeof navigator.getBattery !== "function") {
          batteryState.supported = false;
          updateBatteryLabel();
          return;
        }
        try {
          batteryApi = await navigator.getBattery();
          readBatteryStateFromApi();
          updateBatteryLabel();
          ["levelchange", "chargingchange", "chargingtimechange", "dischargingtimechange"].forEach((eventName) => {
            batteryApi.addEventListener(eventName, () => {
              readBatteryStateFromApi();
              updateBatteryLabel();
            });
          });
        } catch {
          batteryState.supported = false;
          updateBatteryLabel();
        }
      }

      function initNetworkStatus() {
        const refresh = () => {
          readNetworkState();
          updateWifiLabel();
        };
        refresh();
        window.addEventListener("online", refresh);
        window.addEventListener("offline", refresh);
        if (networkConnection && typeof networkConnection.addEventListener === "function") {
          networkConnection.addEventListener("change", refresh);
        }
      }

      function formatSecondsToTime(seconds) {
        if (!Number.isFinite(seconds) || seconds <= 0) {
          return "Calculating…";
        }
        const total = Math.round(seconds);
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        if (hours > 0) {
          return `${hours}h ${minutes}m`;
        }
        return `${minutes}m`;
      }

      function getAppDisplayName(appId) {
        const item = getDockItem(appId);
        if (item) {
          return item.getAttribute("title") || appId;
        }
        return "Finder";
      }

      function setActiveMenuApp(appId) {
        const next = appId && getDockItem(appId) ? appId : "finder";
        activeMenuAppId = next;
        if (activeAppMenu) {
          activeAppMenu.textContent = getAppDisplayName(next);
        }
      }

      function getFrontmostWindowEntry() {
        let topEntry = null;
        let topZ = -Infinity;
        windowState.forEach((entry) => {
          if (!entry || entry.minimized || entry.win.classList.contains("is-hidden")) {
            return;
          }
          const z = Number(entry.win.style.zIndex || 0);
          if (!topEntry || z > topZ) {
            topEntry = entry;
            topZ = z;
          }
        });
        return topEntry;
      }

      function syncActiveMenuApp() {
        const topEntry = getFrontmostWindowEntry();
        setActiveMenuApp(topEntry ? topEntry.appId : "finder");
      }

      function clearOpenMenuTrigger() {
        if (openMenuTrigger) {
          openMenuTrigger.classList.remove("menu-open");
          openMenuTrigger = null;
        }
      }

      function closeContextMenu() {
        contextMenu.classList.remove("open");
        contextMenu.setAttribute("aria-hidden", "true");
        contextMenuList.innerHTML = "";
        clearOpenMenuTrigger();
      }

      function hideDesktopMarquee() {
        desktopMarquee.classList.remove("active");
        desktopMarquee.style.left = "0px";
        desktopMarquee.style.top = "0px";
        desktopMarquee.style.width = "0px";
        desktopMarquee.style.height = "0px";
      }

      function showContextMenu(x, y, items) {
        lastContextPoint = { x, y };
        contextMenuList.innerHTML = "";

        items.forEach((item) => {
          if (!item) {
            return;
          }
          if (item.type === "separator") {
            const sep = document.createElement("div");
            sep.className = "context-menu-sep";
            contextMenuList.appendChild(sep);
            return;
          }

          const button = document.createElement("button");
          button.type = "button";
          button.className = "context-menu-item";
          button.disabled = Boolean(item.disabled);
          button.innerHTML = `${item.label}${item.meta ? `<span class="context-menu-meta">${item.meta}</span>` : ""}`;
          if (!item.disabled && typeof item.action === "function") {
            button.addEventListener("click", () => {
              closeContextMenu();
              item.action();
            });
          }
          contextMenuList.appendChild(button);
        });

        contextMenu.classList.add("open");
        contextMenu.setAttribute("aria-hidden", "false");
        contextMenu.style.left = `${x}px`;
        contextMenu.style.top = `${y}px`;

        requestAnimationFrame(() => {
          const pad = 8;
          const rect = contextMenu.getBoundingClientRect();
          const left = Math.min(Math.max(pad, x), window.innerWidth - rect.width - pad);
          const top = Math.min(Math.max(pad, y), window.innerHeight - rect.height - pad);
          contextMenu.style.left = `${left}px`;
          contextMenu.style.top = `${top}px`;
        });
      }

      function updateWallpaperButtons() {
        document.querySelectorAll("[data-wallpaper-option]").forEach((button) => {
          const optionId = button.getAttribute("data-wallpaper-option");
          button.classList.toggle("active", optionId === currentWallpaperId);
        });
      }

      function applyWallpaper(optionId, persist = true) {
        const option = wallpaperById.get(optionId);
        if (!option) {
          return;
        }
        currentWallpaperId = option.id;
        document.documentElement.style.setProperty("--wallpaper-url", `url("${option.path}")`);
        updateWallpaperButtons();
        if (persist) {
          try {
            window.localStorage.setItem("macos26_wallpaper", option.id);
          } catch {}
        }
      }

      function restoreWallpaperPreference() {
        try {
          const saved = window.localStorage.getItem("macos26_wallpaper");
          if (saved && wallpaperById.has(saved)) {
            applyWallpaper(saved, false);
            return;
          }
        } catch {}
        applyWallpaper("default", false);
      }

      function wireSettingsPreview(win) {
        const picker = win.querySelector("[data-wallpaper-picker]");
        const modeBadge = win.querySelector("[data-location-mode]");
        const useRealBtn = win.querySelector("[data-use-real-location]");
        const cityWrap = win.querySelector("[data-city-wrap]");
        const cityInput = win.querySelector("[data-city-input]");
        const saveCityBtn = win.querySelector("[data-save-city]");
        const locationStatus = win.querySelector("[data-location-status]");

        const showCityFallback = (show) => {
          if (!cityWrap) {
            return;
          }
          cityWrap.classList.toggle("show", show);
        };

        const syncLocationUi = () => {
          if (modeBadge) {
            modeBadge.textContent =
              locationState.mode === "geo"
                ? "Real Location"
                : locationState.mode === "city"
                  ? "Manual City"
                  : "Not set";
          }
          if (locationStatus) {
            const tempInfo = Number.isFinite(weatherState.tempF) ? ` · ${Math.round(weatherState.tempF)}°F` : "";
            locationStatus.textContent = `Current: ${locationState.label}${tempInfo}`;
          }
          if (cityInput && locationState.mode === "city") {
            cityInput.value = locationState.label;
          }
        };

        const requestRealLocation = () => {
          if (!navigator.geolocation) {
            if (locationStatus) {
              locationStatus.textContent = "Geolocation unavailable. Enter a city below.";
            }
            showCityFallback(true);
            if (modeBadge) {
              modeBadge.textContent = "Manual Required";
            }
            return;
          }

          if (locationStatus) {
            locationStatus.textContent = "Requesting location permission…";
          }

          navigator.geolocation.getCurrentPosition(
            (position) => {
              const coords = {
                latitude: Number(position.coords.latitude),
                longitude: Number(position.coords.longitude)
              };
              const label = formatCoordsLabel(coords.latitude, coords.longitude);
              applyWeatherLocation("geo", label, true, coords);
              syncLocationUi();
              showCityFallback(false);
              if (locationStatus) {
                locationStatus.textContent = `Using real location (${label})`;
              }
            },
            () => {
              showCityFallback(true);
              if (modeBadge) {
                modeBadge.textContent = "Permission Denied";
              }
              if (locationStatus) {
                locationStatus.textContent = "Location access denied. Please type a city.";
              }
              if (cityInput) {
                cityInput.focus();
              }
            },
            { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
          );
        };

        const saveCity = () => {
          const city = (cityInput?.value || "").trim();
          if (!city) {
            if (locationStatus) {
              locationStatus.textContent = "Please type a city name.";
            }
            return;
          }
          applyWeatherLocation("city", city, true);
          syncLocationUi();
          showCityFallback(true);
          if (locationStatus) {
            locationStatus.textContent = `Using manual city: ${city} (fetching weather…)`;
          }
        };

        if (!picker) {
          syncLocationUi();
        } else {
          picker.innerHTML = wallpaperOptions
            .map((option) => `
              <button class="wallpaper-option" type="button" data-wallpaper-option="${option.id}">
                <img src="${option.path}" alt="${option.label} wallpaper" />
                <span>${option.label}</span>
              </button>
            `)
            .join("");
          picker.querySelectorAll("[data-wallpaper-option]").forEach((button) => {
            button.addEventListener("click", () => {
              const optionId = button.getAttribute("data-wallpaper-option");
              if (optionId) {
                applyWallpaper(optionId, true);
              }
            });
          });
          updateWallpaperButtons();
        }

        if (useRealBtn) {
          useRealBtn.addEventListener("click", requestRealLocation);
        }
        if (saveCityBtn) {
          saveCityBtn.addEventListener("click", saveCity);
        }
        if (cityInput) {
          cityInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              saveCity();
            }
          });
        }

        syncLocationUi();
        if (locationState.mode === "city") {
          showCityFallback(true);
        } else if (locationState.mode === "default") {
          requestRealLocation();
        } else {
          showCityFallback(false);
        }
      }

      function getStageRect() {
        return stage.getBoundingClientRect();
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function applyWindowFrame(win, frame) {
        win.style.left = `${frame.left}px`;
        win.style.top = `${frame.top}px`;
        win.style.width = `${frame.width}px`;
        win.style.height = `${frame.height}px`;
      }

      function animateWindowFrame(win, targetFrame, makeMaximized) {
        if (prefersReducedMotion) {
          win.classList.remove("frame-animating");
          win.classList.toggle("maximized", makeMaximized);
          applyWindowFrame(win, targetFrame);
          return;
        }

        win.classList.remove("opening", "closing", "minimizing", "restoring");
        win.classList.add("frame-animating");
        win.classList.toggle("maximized", makeMaximized);

        const onDone = (event) => {
          if (event && !["left", "top", "width", "height", "border-radius"].includes(event.propertyName)) {
            return;
          }
          win.classList.remove("frame-animating");
          win.removeEventListener("transitionend", onDone);
        };

        win.addEventListener("transitionend", onDone);
        requestAnimationFrame(() => applyWindowFrame(win, targetFrame));
        setTimeout(() => onDone(), 420);
      }

      function captureFrame(win) {
        const stageRect = getStageRect();
        const rect = win.getBoundingClientRect();
        return {
          left: rect.left - stageRect.left,
          top: rect.top - stageRect.top,
          width: rect.width,
          height: rect.height
        };
      }

      function centerWindow(win) {
        const stageRect = getStageRect();
        const rect = win.getBoundingClientRect();
        const width = Math.min(rect.width, stageRect.width);
        const height = Math.min(rect.height, stageRect.height);
        applyWindowFrame(win, {
          left: Math.max(0, (stageRect.width - width) / 2),
          top: Math.max(0, (stageRect.height - height) / 2),
          width,
          height
        });
      }

      function focusWindow(win) {
        zSeed += 1;
        win.style.zIndex = String(zSeed);
        if (win?.dataset?.app) {
          setActiveMenuApp(win.dataset.app);
        }
      }

      function afterAnimation(node, cb) {
        if (prefersReducedMotion) {
          cb();
          return;
        }
        const done = () => {
          node.removeEventListener("animationend", done);
          cb();
        };
        node.addEventListener("animationend", done);
      }

      function getDockVector(win, item) {
        const winRect = win.getBoundingClientRect();
        const iconRect = item.querySelector(".dock-icon").getBoundingClientRect();
        const dx = (iconRect.left + iconRect.width / 2) - (winRect.left + winRect.width / 2);
        const dy = (iconRect.top + iconRect.height / 2) - (winRect.top + winRect.height / 2);
        return { dx, dy };
      }

      function resolveSafariTarget(rawValue) {
        const value = String(rawValue || "").trim();
        if (!value) {
          return null;
        }

        if (/^[a-zA-Z][a-zA-Z\d+\-.]*:\/\//.test(value)) {
          try {
            return new URL(value).href;
          } catch {
            return null;
          }
        }

        if (/^localhost(?::\d+)?(?:\/.*)?$/i.test(value) || /^127(?:\.\d{1,3}){3}(?::\d+)?(?:\/.*)?$/.test(value)) {
          return `http://${value}`;
        }

        if (/^[^\s]+\.[^\s]{2,}(?:\/[^\s]*)?$/i.test(value)) {
          return `https://${value}`;
        }

        return `https://www.google.com/search?q=${encodeURIComponent(value)}`;
      }

      function wireSafariPreview(win) {
        const form = win.querySelector("[data-safari-form]");
        const input = win.querySelector("[data-safari-input]");
        const status = win.querySelector("[data-safari-status]");
        const quickButtons = win.querySelectorAll("[data-safari-quick]");

        const openTarget = (raw) => {
          const target = resolveSafariTarget(raw);
          if (!target) {
            if (status) {
              status.textContent = "Enter a URL or search term.";
            }
            return;
          }
          window.open(target, "_blank", "noopener,noreferrer");
          if (status) {
            status.textContent = `Opened: ${target}`;
          }
        };

        if (form && input) {
          form.addEventListener("submit", (event) => {
            event.preventDefault();
            openTarget(input.value);
          });
        }

        quickButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const target = button.getAttribute("data-safari-quick") || "";
            if (input) {
              input.value = target;
            }
            openTarget(target);
          });
        });
      }

      function toggleMaximize(appId) {
        const entry = windowState.get(appId);
        if (!entry) {
          return;
        }
        const win = entry.win;
        focusWindow(win);
        const stageRect = getStageRect();
        if (!entry.maximized) {
          entry.restoreFrame = captureFrame(win);
          animateWindowFrame(
            win,
            { left: 0, top: 0, width: stageRect.width, height: stageRect.height },
            true
          );
          entry.maximized = true;
          return;
        }
        entry.maximized = false;
        if (entry.restoreFrame) {
          animateWindowFrame(win, entry.restoreFrame, false);
        } else {
          const rect = win.getBoundingClientRect();
          const width = Math.min(rect.width, stageRect.width);
          const height = Math.min(rect.height, stageRect.height);
          animateWindowFrame(
            win,
            {
              left: Math.max(0, (stageRect.width - width) / 2),
              top: Math.max(0, (stageRect.height - height) / 2),
              width,
              height
            },
            false
          );
        }
      }

      function startDrag(event, appId) {
        if (event.button !== 0 || event.target.closest(".dot-btn")) {
          return;
        }
        const entry = windowState.get(appId);
        if (!entry || entry.maximized || entry.minimized) {
          return;
        }
        const win = entry.win;
        const stageRect = getStageRect();
        const rect = win.getBoundingClientRect();
        const offsetX = event.clientX - rect.left;
        const offsetY = event.clientY - rect.top;
        const width = rect.width;
        const height = rect.height;

        applyWindowFrame(win, {
          left: rect.left - stageRect.left,
          top: rect.top - stageRect.top,
          width,
          height
        });
        win.classList.add("dragging");
        focusWindow(win);
        event.preventDefault();

        const onMove = (moveEvent) => {
          const nextLeft = clamp(moveEvent.clientX - offsetX - stageRect.left, 0, Math.max(0, stageRect.width - width));
          const nextTop = clamp(moveEvent.clientY - offsetY - stageRect.top, 0, Math.max(0, stageRect.height - height));
          win.style.left = `${nextLeft}px`;
          win.style.top = `${nextTop}px`;
        };

        const onUp = () => {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
          win.classList.remove("dragging");
          entry.restoreFrame = captureFrame(win);
        };

        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
      }

      function startResize(event, appId, edge) {
        if (event.button !== 0) {
          return;
        }
        const entry = windowState.get(appId);
        if (!entry || entry.maximized || entry.minimized) {
          return;
        }

        const win = entry.win;
        const stageRect = getStageRect();
        const start = captureFrame(win);
        const startClientX = event.clientX;
        const startClientY = event.clientY;
        const minWidth = 360;
        const minHeight = 220;

        win.classList.remove("frame-animating", "opening", "restoring");
        focusWindow(win);
        event.preventDefault();
        event.stopPropagation();

        const onMove = (moveEvent) => {
          const dx = moveEvent.clientX - startClientX;
          const dy = moveEvent.clientY - startClientY;

          let left = start.left;
          let top = start.top;
          let width = start.width;
          let height = start.height;
          const right = start.left + start.width;
          const bottom = start.top + start.height;

          if (edge.includes("e")) {
            width = clamp(start.width + dx, minWidth, stageRect.width - start.left);
          }
          if (edge.includes("s")) {
            height = clamp(start.height + dy, minHeight, stageRect.height - start.top);
          }
          if (edge.includes("w")) {
            left = clamp(start.left + dx, 0, right - minWidth);
            width = right - left;
          }
          if (edge.includes("n")) {
            top = clamp(start.top + dy, 0, bottom - minHeight);
            height = bottom - top;
          }

          width = clamp(width, minWidth, stageRect.width - left);
          height = clamp(height, minHeight, stageRect.height - top);
          applyWindowFrame(win, { left, top, width, height });
        };

        const onUp = () => {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
          entry.restoreFrame = captureFrame(win);
        };

        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
      }

      function createWindow(appId, title, item) {
        const win = document.createElement("article");
        win.className = "app-window opening";
        win.dataset.app = appId;
        win.innerHTML = `
          <header class="win-topbar">
            <div class="traffic">
              <button class="dot-btn dot-close" data-action="close" aria-label="Close"></button>
              <button class="dot-btn dot-min" data-action="minimize" aria-label="Minimize"></button>
              <button class="dot-btn dot-max" data-action="zoom" aria-label="Zoom"></button>
            </div>
            <p class="win-title">${title}</p>
          </header>
          <section class="win-content">${previews[appId] || previews.finder}</section>
          <span class="resize-handle rh-n" data-edge="n" aria-hidden="true"></span>
          <span class="resize-handle rh-e" data-edge="e" aria-hidden="true"></span>
          <span class="resize-handle rh-s" data-edge="s" aria-hidden="true"></span>
          <span class="resize-handle rh-w" data-edge="w" aria-hidden="true"></span>
          <span class="resize-handle rh-ne" data-edge="ne" aria-hidden="true"></span>
          <span class="resize-handle rh-nw" data-edge="nw" aria-hidden="true"></span>
          <span class="resize-handle rh-se" data-edge="se" aria-hidden="true"></span>
          <span class="resize-handle rh-sw" data-edge="sw" aria-hidden="true"></span>
        `;

        stage.appendChild(win);
        centerWindow(win);
        if (item) {
          const { dx, dy } = getDockVector(win, item);
          win.style.setProperty("--open-x", `${Math.round(dx * 0.24)}px`);
          win.style.setProperty("--open-y", `${Math.round(dy * 0.24)}px`);
        } else {
          win.style.setProperty("--open-x", "0px");
          win.style.setProperty("--open-y", "0px");
        }
        focusWindow(win);
        afterAnimation(win, () => win.classList.remove("opening"));

        win.addEventListener("mousedown", () => focusWindow(win));
        const topbar = win.querySelector(".win-topbar");
        topbar.addEventListener("mousedown", (event) => startDrag(event, appId));
        topbar.addEventListener("dblclick", () => toggleMaximize(appId));
        win.querySelectorAll(".resize-handle").forEach((handle) => {
          handle.addEventListener("mousedown", (event) => startResize(event, appId, handle.dataset.edge || ""));
        });
        win.querySelector('[data-action="close"]').addEventListener("click", (event) => {
          event.stopPropagation();
          closeWindow(appId);
        });
        win.querySelector('[data-action="minimize"]').addEventListener("click", (event) => {
          event.stopPropagation();
          minimizeWindow(appId);
        });
        win.querySelector('[data-action="zoom"]').addEventListener("click", (event) => {
          event.stopPropagation();
          toggleMaximize(appId);
        });

        if (appId === "safari") {
          wireSafariPreview(win);
        }
        if (appId === "settings") {
          wireSettingsPreview(win);
        }

        return win;
      }

      function restoreWindow(appId) {
        const entry = windowState.get(appId);
        if (!entry || !entry.minimized) {
          return;
        }
        const win = entry.win;
        const { dx, dy } = getDockVector(win, entry.item);
        win.style.setProperty("--from-x", `${dx}px`);
        win.style.setProperty("--from-y", `${dy}px`);
        win.classList.remove("is-hidden", "closing", "minimizing", "dragging");
        focusWindow(win);
        entry.minimized = false;
        win.classList.add("restoring");
        afterAnimation(win, () => win.classList.remove("restoring"));
      }

      function minimizeWindow(appId) {
        const entry = windowState.get(appId);
        if (!entry || entry.minimized) {
          return;
        }
        const win = entry.win;
        const { dx, dy } = getDockVector(win, entry.item);
        win.style.setProperty("--to-x", `${dx}px`);
        win.style.setProperty("--to-y", `${dy}px`);
        win.classList.remove("restoring", "closing", "dragging", "frame-animating");
        focusWindow(win);
        win.classList.add("minimizing");
        afterAnimation(win, () => {
          win.classList.remove("minimizing");
          win.classList.add("is-hidden");
          entry.minimized = true;
          syncActiveMenuApp();
        });
      }

      function closeWindow(appId) {
        const entry = windowState.get(appId);
        if (!entry) {
          return;
        }
        const win = entry.win;
        win.classList.remove("restoring", "minimizing", "is-hidden", "frame-animating");
        focusWindow(win);
        win.classList.add("closing");
        afterAnimation(win, () => {
          win.remove();
          windowState.delete(appId);
          setRunning(entry.item, false);
          syncActiveMenuApp();
        });
      }

      function openWindow(appId, item, title) {
        const existing = windowState.get(appId);
        if (existing) {
          if (existing.minimized) {
            restoreWindow(appId);
            return;
          }
          focusWindow(existing.win);
          if (!prefersReducedMotion) {
            existing.win.animate(
              [
                { filter: "brightness(1)" },
                { filter: "brightness(1.18)" },
                { filter: "brightness(1)" }
              ],
              { duration: 170, easing: "ease-out", fill: "none" }
            );
          }
          return;
        }

        const win = createWindow(appId, title, item);
        windowState.set(appId, { appId, item, win, minimized: false, maximized: false, restoreFrame: captureFrame(win) });
        setRunning(item, true);
      }

      function launchApp(appId) {
        const item = getDockItem(appId);
        if (!item) {
          return;
        }
        openWindow(appId, item, item.getAttribute("title") || appId);
      }

      function centerAppWindow(appId) {
        const entry = windowState.get(appId);
        if (!entry) {
          return;
        }
        const win = entry.win;
        if (entry.maximized) {
          toggleMaximize(appId);
        }
        centerWindow(win);
        entry.restoreFrame = captureFrame(win);
        focusWindow(win);
      }

      function contextItemsForDock(appId) {
        const entry = windowState.get(appId);
        if (!entry) {
          return [
            { label: "Open", action: () => launchApp(appId) },
            { type: "separator" },
            { label: "Show App Info", action: () => {} }
          ];
        }

        return [
          {
            label: entry.minimized ? "Show Window" : "Hide Window",
            action: () => (entry.minimized ? restoreWindow(appId) : minimizeWindow(appId))
          },
          {
            label: entry.maximized ? "Restore" : "Zoom",
            action: () => toggleMaximize(appId)
          },
          { type: "separator" },
          { label: "Close Window", action: () => closeWindow(appId) }
        ];
      }

      function contextItemsForWindow(appId) {
        const entry = windowState.get(appId);
        if (!entry) {
          return [];
        }
        return [
          { label: "Minimize", action: () => minimizeWindow(appId) },
          { label: entry.maximized ? "Restore" : "Zoom", action: () => toggleMaximize(appId) },
          { label: "Center Window", action: () => centerAppWindow(appId) },
          { type: "separator" },
          { label: "Close Window", action: () => closeWindow(appId) }
        ];
      }

      function contextItemsForDesktop() {
        const openCount = windowState.size;
        return [
          { label: "Widgets…", action: () => openWidgetsPanelAt(lastContextPoint.x + 10, lastContextPoint.y + 10) },
          { type: "separator" },
          { label: "Wallpaper Settings…", action: () => launchApp("settings") },
          { label: "Show Desktop", action: () => Array.from(windowState.keys()).forEach((id) => minimizeWindow(id)) },
          { type: "separator" },
          {
            label: "Close All Windows",
            disabled: openCount === 0,
            meta: openCount ? `${openCount}` : "",
            action: () => Array.from(windowState.keys()).forEach((id) => closeWindow(id))
          }
        ];
      }

      function contextItemsForMenubar(menuId) {
        const focused = getFrontmostWindowEntry();
        const focusedAppId = focused?.appId || null;
        const appEntry = windowState.get(activeMenuAppId);
        const activeName = getAppDisplayName(activeMenuAppId);

        switch (menuId) {
          case "apple":
            return [
              { label: "About macOS 26 Mock", action: () => {} },
              { type: "separator" },
              { label: "System Settings…", action: () => launchApp("settings") },
              { label: "Widgets…", action: () => openWidgetsPanelAt(window.innerWidth - 340, 44) },
              { type: "separator" },
              { label: "Show Desktop", action: () => Array.from(windowState.keys()).forEach((id) => minimizeWindow(id)) }
            ];
          case "app":
            if (!appEntry) {
              return [
                { label: `Open ${activeName}`, action: () => launchApp(activeMenuAppId) },
                { type: "separator" },
                { label: "System Settings…", action: () => launchApp("settings") }
              ];
            }
            return [
              { label: `About ${activeName}`, action: () => {} },
              { type: "separator" },
              {
                label: appEntry.minimized ? "Show Window" : "Hide Window",
                action: () => (appEntry.minimized ? restoreWindow(activeMenuAppId) : minimizeWindow(activeMenuAppId))
              },
              { label: "Close Window", action: () => closeWindow(activeMenuAppId) }
            ];
          case "file":
            return [
              { label: "New Finder Window", action: () => launchApp("finder") },
              { label: "Open Safari", action: () => launchApp("safari") },
              { label: "Open Settings", action: () => launchApp("settings") },
              { type: "separator" },
              {
                label: "Close Window",
                disabled: !focusedAppId,
                action: () => focusedAppId && closeWindow(focusedAppId)
              }
            ];
          case "edit":
            return [
              { label: "Undo", disabled: true },
              { label: "Redo", disabled: true },
              { type: "separator" },
              { label: "Cut", disabled: true },
              { label: "Copy", disabled: true },
              { label: "Paste", disabled: true }
            ];
          case "view":
            return [
              {
                label: focused?.maximized ? "Exit Full Screen" : "Enter Full Screen",
                disabled: !focusedAppId,
                action: () => focusedAppId && toggleMaximize(focusedAppId)
              },
              {
                label: "Center Window",
                disabled: !focusedAppId,
                action: () => focusedAppId && centerAppWindow(focusedAppId)
              }
            ];
          case "go":
            return [
              { label: "Applications", action: () => launchApp("launchpad") },
              { label: "Downloads", action: () => launchApp("finder") },
              { label: "Home", action: () => launchApp("finder") }
            ];
          case "window":
            return [
              {
                label: "Minimize",
                disabled: !focusedAppId,
                action: () => focusedAppId && minimizeWindow(focusedAppId)
              },
              {
                label: "Zoom",
                disabled: !focusedAppId,
                action: () => focusedAppId && toggleMaximize(focusedAppId)
              },
              {
                label: "Center Window",
                disabled: !focusedAppId,
                action: () => focusedAppId && centerAppWindow(focusedAppId)
              },
              { type: "separator" },
              { label: "Show Desktop", action: () => Array.from(windowState.keys()).forEach((id) => minimizeWindow(id)) }
            ];
          case "help":
            return [
              { label: "Safari Help", action: () => launchApp("safari") },
              { label: "Widget Help", action: () => openWidgetsPanelAt(window.innerWidth - 340, 44) },
              { label: "System Settings Help", action: () => launchApp("settings") }
            ];
          case "weather":
            return [
              { label: "Refresh Weather Now", action: () => refreshWeatherForLocation() },
              { label: "Weather Settings…", action: () => launchApp("settings") }
            ];
          case "wifi":
            return [
              { label: `Status: ${networkPrimaryLabel()}`, disabled: true },
              {
                label: networkState.supported && networkState.effectiveType
                  ? `Quality: ${networkState.effectiveType.toUpperCase()}`
                  : "Quality: Unavailable",
                disabled: true
              },
              {
                label: Number.isFinite(networkState.downlink)
                  ? `Downlink: ${networkState.downlink.toFixed(1)} Mbps`
                  : "Downlink: Unavailable",
                disabled: true
              },
              { type: "separator" },
              { label: "Network Settings…", action: () => launchApp("settings") }
            ];
          case "battery":
            return [
              {
                label: `Battery: ${
                  Number.isFinite(batteryState.level) ? `${Math.round(batteryState.level * 100)}%` : "Unavailable"
                }`,
                disabled: true
              },
              {
                label: batteryState.charging === null
                  ? "State: Unknown"
                  : batteryState.charging
                    ? `State: Charging (${formatSecondsToTime(batteryState.chargingTime)})`
                    : `State: On Battery (${formatSecondsToTime(batteryState.dischargingTime)} remaining)`,
                disabled: true
              },
              { type: "separator" },
              { label: "Battery Settings…", action: () => launchApp("settings") }
            ];
          case "clock":
            return [
              { label: "Open Clock Widget", action: () => addWidgetToDesktop("clock") },
              { label: "Show Widgets Panel", action: () => openWidgetsPanelAt(window.innerWidth - 340, 44) }
            ];
          default:
            return contextItemsForDesktop();
        }
      }

      function openMenubarMenu(button) {
        const menuId = button.getAttribute("data-menubar");
        if (!menuId) {
          return;
        }
        const isSame = openMenuTrigger === button && contextMenu.classList.contains("open");
        closeContextMenu();
        if (isSame) {
          return;
        }
        const rect = button.getBoundingClientRect();
        openMenuTrigger = button;
        openMenuTrigger.classList.add("menu-open");
        showContextMenu(rect.left, rect.bottom + 6, contextItemsForMenubar(menuId));
      }

      function asElement(target) {
        if (target instanceof Element) {
          return target;
        }
        return target?.parentElement || null;
      }

      function isDesktopDragBlockedTarget(target) {
        return Boolean(
          target?.closest(".menu-bar") ||
          target?.closest(".dock") ||
          target?.closest(".app-window") ||
          target?.closest(".desktop-widget") ||
          target?.closest("#widgetsPanel") ||
          target?.closest("#contextMenu") ||
          target?.closest("input,button,textarea,select,option,a,label,[contenteditable='true']")
        );
      }

      document.addEventListener("mousedown", (event) => {
        if (event.defaultPrevented) {
          return;
        }
        if (event.button !== 0) {
          return;
        }
        const target = asElement(event.target);
        if (
          !target ||
          isDesktopDragBlockedTarget(target)
        ) {
          return;
        }

        const startX = event.clientX;
        const startY = event.clientY;
        let started = false;
        closeContextMenu();
        event.preventDefault();

        const onMove = (moveEvent) => {
          const dx = moveEvent.clientX - startX;
          const dy = moveEvent.clientY - startY;
          if (!started && Math.hypot(dx, dy) < 3) {
            return;
          }
          started = true;
          const left = Math.min(startX, moveEvent.clientX);
          const top = Math.min(startY, moveEvent.clientY);
          const width = Math.abs(dx);
          const height = Math.abs(dy);
          desktopMarquee.style.left = `${left}px`;
          desktopMarquee.style.top = `${top}px`;
          desktopMarquee.style.width = `${width}px`;
          desktopMarquee.style.height = `${height}px`;
          desktopMarquee.classList.add("active");
        };

        const onUp = () => {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
          if (started) {
            hideDesktopMarquee();
          }
        };

        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
      });

      dockItems.forEach((item) => {
        const appId = item.dataset.app;
        const title = item.getAttribute("title") || appId;
        item.addEventListener("click", () => openWindow(appId, item, title));
      });

      menuButtons.forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          openMenubarMenu(button);
        });
        button.addEventListener("mouseenter", () => {
          if (openMenuTrigger && openMenuTrigger !== button && contextMenu.classList.contains("open")) {
            openMenubarMenu(button);
          }
        });
      });

      document.addEventListener("contextmenu", (event) => {
        const target = asElement(event.target);
        if (!target) {
          return;
        }

        if (target.closest("#contextMenu")) {
          event.preventDefault();
          return;
        }

        if (target.closest("#widgetsPanel")) {
          event.preventDefault();
          closeContextMenu();
          return;
        }

        if (target.closest(".menu-bar")) {
          event.preventDefault();
          closeContextMenu();
          return;
        }

        const dockItem = target.closest(".dock-item[data-app]");
        if (dockItem) {
          const appId = dockItem.dataset.app || "";
          event.preventDefault();
          event.stopPropagation();
          showContextMenu(event.clientX, event.clientY, contextItemsForDock(appId));
          return;
        }

        const win = target.closest(".app-window");
        if (win) {
          event.preventDefault();
          event.stopPropagation();
          showContextMenu(event.clientX, event.clientY, contextItemsForWindow(win.dataset.app || ""));
          return;
        }

        event.preventDefault();
        event.stopPropagation();
        showContextMenu(event.clientX, event.clientY, contextItemsForDesktop());
      }, true);

      document.addEventListener("mousedown", (event) => {
        if (!contextMenu.classList.contains("open")) {
          if (widgetsPanel.classList.contains("open") && !widgetsPanel.contains(event.target)) {
            closeWidgetsPanel();
          }
          return;
        }
        if (!contextMenu.contains(event.target)) {
          closeContextMenu();
          if (widgetsPanel.classList.contains("open") && !widgetsPanel.contains(event.target)) {
            closeWidgetsPanel();
          }
        }
      });

      widgetsPanelClose?.addEventListener("click", closeWidgetsPanel);

      window.addEventListener("blur", closeContextMenu);
      window.addEventListener("resize", closeContextMenu);
      window.addEventListener("resize", hideDesktopMarquee);
      window.addEventListener("blur", closeWidgetsPanel);
      window.addEventListener("resize", closeWidgetsPanel);
      window.addEventListener("resize", keepDesktopWidgetsInBounds);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeContextMenu();
          hideDesktopMarquee();
          closeWidgetsPanel();
        }
      });

      restoreWallpaperPreference();
      restoreLocationPreference();
      restoreDesktopWidgets();
      renderWidgetsPanelList();
      initNetworkStatus();
      initBatteryStatus();
      setActiveMenuApp("finder");
      setInterval(refreshWeatherForLocation, 10 * 60 * 1000);
    })();
  </script>
</body>
</html>
