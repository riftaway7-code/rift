<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rift OS</title>
  <style>
    @font-face {
      font-family: "SF Pro Display Local";
      src: url("macos%20fonts/sf-pro-display/SFPRODISPLAYREGULAR.OTF") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "SF Pro Display Local";
      src: url("macos%20fonts/sf-pro-display/SFPRODISPLAYMEDIUM.OTF") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "SF Pro Display Local";
      src: url("macos%20fonts/sf-pro-display/SFPRODISPLAYBOLD.OTF") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "SF Compact Display Local";
      src: url("macos%20fonts/sf-compact-display/sf-compact-display-medium-5864711817c30.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "SF Mono Local";
      src: url("macos%20fonts/SF-Mono-Font-master/SF-Mono-Font-master/SFMono-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --text: #f4f8ff;
      --muted: rgba(244, 248, 255, 0.82);
      --glass: rgba(255, 255, 255, 0.16);
      --glass-strong: rgba(255, 255, 255, 0.10);
      --line: rgba(255, 255, 255, 0.26);
      --shadow: 0 22px 42px rgba(8, 12, 25, 0.34);
      --wallpaper-url: url("wallpapers/default.jpg");
      --cur-wait: url("cursors/split/cursor_01.png") 15 15;
      --cur-text: url("cursors/split/cursor_02.png") 9 14;
      --cur-cross: url("cursors/split/cursor_03.png") 12 12;
      --cur-default: url("cursors/split/cursor_04.png") 2 2;
      --cur-alias: url("cursors/split/cursor_05.png") 2 2;
      --cur-grabbing: url("cursors/split/cursor_06.png") 12 6;
      --cur-move: url("cursors/split/cursor_07.png") 14 14;
      --cur-zoom-out: url("cursors/split/cursor_08.png") 10 10;
      --cur-zoom-in: url("cursors/split/cursor_09.png") 10 10;
      --cur-grab: url("cursors/split/cursor_10.png") 12 7;
      --cur-pointer: url("cursors/split/cursor_11.png") 8 4;
      --cur-n-resize: url("cursors/split/cursor_12.png") 12 12;
      --cur-ns-resize: url("cursors/split/cursor_13.png") 12 17;
      --cur-w-resize: url("cursors/split/cursor_14.png") 12 12;
      --cur-e-resize: url("cursors/split/cursor_15.png") 12 12;
      --cur-ew-resize: url("cursors/split/cursor_16.png") 17 12;
      --cur-s-resize: url("cursors/split/cursor_17.png") 12 12;
      --cur-row-resize: url("cursors/split/cursor_18.png") 10 16;
      --cur-nwse-resize: url("cursors/split/cursor_19.png") 13 13;
      --cur-nesw-resize: url("cursors/split/cursor_20.png") 13 13;
      --cur-col-resize: url("cursors/split/cursor_21.png") 16 10;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-family: "SF Pro Display Local", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      user-select: none;
      cursor: var(--cur-default), auto;
    }

    body {
      position: relative;
      background:
        radial-gradient(70% 60% at 12% 10%, rgba(9, 20, 42, 0.34), transparent 62%),
        linear-gradient(180deg, rgba(7, 12, 25, 0.20), rgba(7, 12, 25, 0.34)),
        var(--wallpaper-url) center center / cover no-repeat;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      background-image: radial-gradient(rgba(255, 255, 255, 0.45) 0.8px, transparent 0.8px);
      background-size: 3px 3px;
      z-index: 0;
    }

    .menu-bar {
      position: fixed;
      inset: 0 0 auto 0;
      height: 36px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: none !important;
      background-color: transparent !important;
      background-image: none !important;
      border: none !important;
      border-bottom: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
      z-index: 50;
      overflow: visible;
      isolation: auto;
      font-size: 13px;
      letter-spacing: 0.2px;
    }

    .menu-bar::before,
    .menu-bar::after {
      content: none !important;
      display: none !important;
      background: none !important;
    }

    .menu-left,
    .menu-right {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
      z-index: 1;
      white-space: nowrap;
      cursor: var(--cur-default), auto;
    }

    .menu-btn {
      border: 0;
      background: transparent;
      color: var(--text);
      height: 24px;
      padding: 0 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      letter-spacing: 0.2px;
      font-family: inherit;
      cursor: var(--cur-pointer), pointer;
      transition: background 120ms ease, color 120ms ease;
    }

    .menu-btn:hover {
      background: rgba(255, 255, 255, 0.17);
    }

    .menu-btn.menu-open {
      background: rgba(255, 255, 255, 0.23);
    }

    .menu-btn:focus-visible {
      outline: 2px solid rgba(146, 206, 255, 0.9);
      outline-offset: 1px;
    }

    .menu-apple {
      padding: 0 5px;
      min-width: 26px;
      justify-content: center;
    }

    .menu-mono {
      font-family: "SF Mono Local", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .apple-logo {
      width: 20px;
      height: 20px;
      display: block;
      object-fit: contain;
      margin-right: 0;
      transform: translateY(0);
      pointer-events: none;
    }

    .bold {
      font-weight: 600;
    }

    .menu-fade {
      color: var(--muted);
    }

    .desktop {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 58px 24px 130px;
      display: grid;
      grid-template-columns: 1fr;
      place-items: center;
      gap: 0;
    }

    .icon-column {
      display: grid;
      grid-auto-rows: max-content;
      gap: 16px;
      justify-items: center;
      align-content: start;
    }

    .desktop-icon {
      width: 84px;
      text-align: center;
      font-size: 12px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.38);
    }

    .desktop-icon .glyph {
      width: 62px;
      height: 62px;
      margin: 0 auto 7px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 24px;
      background: linear-gradient(150deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.28));
      border: 1px solid rgba(255, 255, 255, 0.44);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.72), 0 8px 16px rgba(0, 0, 0, 0.2);
      color: #243253;
    }

    .center {
      display: grid;
      justify-items: center;
      align-content: start;
      text-align: center;
      width: 100%;
      height: 100%;
      padding-top: 26px;
    }

    .hero-time {
      margin: 0;
      font-size: clamp(58px, 8.8vw, 116px);
      line-height: 1;
      font-weight: 560;
      font-family: "SF Compact Display Local", "SF Pro Display Local", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      text-shadow: 0 8px 24px rgba(8, 12, 26, 0.34);
    }

    .hero-date {
      margin-top: 8px;
      font-size: clamp(18px, 2.2vw, 28px);
      color: rgba(250, 252, 255, 0.95);
      text-shadow: 0 5px 14px rgba(8, 12, 25, 0.28);
    }

    .window-stage {
      position: fixed;
      inset: 36px 0 86px;
      z-index: 55;
      pointer-events: none;
    }

    .app-window {
      --win-w: min(860px, calc(100vw - 120px));
      --win-h: min(560px, calc(100vh - 190px));
      width: var(--win-w);
      height: var(--win-h);
      position: absolute;
      left: 0;
      top: 0;
      transform: none;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(17, 23, 39, 0.72);
      backdrop-filter: blur(24px) saturate(1.15);
      -webkit-backdrop-filter: blur(24px) saturate(1.15);
      box-shadow: 0 26px 52px rgba(8, 12, 24, 0.42);
      pointer-events: auto;
      display: grid;
      grid-template-rows: 40px 1fr;
      transform-origin: center;
      will-change: transform, opacity;
    }

    .app-window.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .app-window.opening {
      animation: appOpen 320ms cubic-bezier(0.16, 0.82, 0.24, 1);
    }

    .app-window.closing {
      animation: appClose 190ms cubic-bezier(0.55, 0.02, 0.86, 0.3) forwards;
    }

    .app-window.minimizing {
      animation: appMinimize 250ms cubic-bezier(0.55, 0.06, 0.85, 0.25) forwards;
    }

    .app-window.restoring {
      animation: appRestore 250ms cubic-bezier(0.2, 0.82, 0.22, 1);
    }

    .app-window.zoomed {
      --win-w: min(1100px, calc(100vw - 64px));
      --win-h: min(760px, calc(100vh - 130px));
    }

    .app-window.maximized {
      border-radius: 16px;
    }

    .app-window.maximized .resize-handle {
      display: none;
    }

    .app-window.frame-animating {
      transition:
        left 280ms cubic-bezier(0.22, 0.78, 0.2, 1),
        top 280ms cubic-bezier(0.22, 0.78, 0.2, 1),
        width 280ms cubic-bezier(0.22, 0.78, 0.2, 1),
        height 280ms cubic-bezier(0.22, 0.78, 0.2, 1),
        border-radius 220ms ease;
    }

    .win-topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      background: rgba(28, 36, 58, 0.58);
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      cursor: var(--cur-grab), grab;
    }

    .app-window.dragging .win-topbar {
      cursor: var(--cur-grabbing), grabbing;
    }

    .traffic {
      display: flex;
      gap: 8px;
    }

    .dot-btn {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 0;
      padding: 0;
      cursor: var(--cur-pointer), pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .dot-close { background: #ff5f57; }
    .dot-min { background: #febc2e; }
    .dot-max { background: #28c840; }

    .win-title {
      margin: 0 auto 0 0;
      font-size: 12px;
      color: rgba(244, 249, 255, 0.9);
      letter-spacing: 0.2px;
    }

    .win-content {
      background:
        linear-gradient(165deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.03)),
        rgba(9, 13, 26, 0.58);
      padding: 14px;
      overflow: auto;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      cursor: var(--cur-default), auto;
    }

    .preview-grid {
      height: 100%;
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: minmax(120px, 1fr);
    }

    .preview-card {
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.06)),
        rgba(30, 41, 66, 0.52);
      padding: 12px;
      color: rgba(245, 249, 255, 0.92);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
      overflow: hidden;
    }

    .preview-card h4 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .preview-card p {
      margin: 0;
      font-size: 12px;
      color: rgba(240, 246, 255, 0.84);
      line-height: 1.45;
      cursor: var(--cur-text), text;
    }

    .preview-span-2 {
      grid-column: span 2;
    }

    .mail-lines,
    .settings-lines {
      display: grid;
      gap: 7px;
      margin-top: 8px;
    }

    .settings-widget-box {
      margin-top: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.08);
      display: grid;
      gap: 8px;
    }

    .settings-widget-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: rgba(245, 250, 255, 0.94);
    }

    .settings-pill {
      height: 22px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.12);
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      color: rgba(236, 247, 255, 0.92);
    }

    .settings-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .settings-btn,
    .settings-save {
      height: 30px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.12);
      color: rgba(245, 251, 255, 0.95);
      font-size: 12px;
      padding: 0 10px;
      cursor: var(--cur-pointer), pointer;
    }

    .settings-save {
      background: linear-gradient(160deg, rgba(130, 205, 255, 0.42), rgba(54, 119, 221, 0.34));
    }

    .settings-city-wrap {
      display: none;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .settings-city-wrap.show {
      display: grid;
    }

    .settings-input {
      height: 30px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(10, 14, 28, 0.42);
      color: rgba(245, 251, 255, 0.95);
      font-size: 12px;
      padding: 0 10px;
      outline: none;
      cursor: var(--cur-text), text;
    }

    .settings-helper {
      margin: 0;
      font-size: 11px;
      line-height: 1.35;
      color: rgba(212, 230, 248, 0.9);
    }

    .wallpaper-picker {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .wallpaper-option {
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 6px;
      text-align: left;
      color: rgba(245, 250, 255, 0.96);
      cursor: var(--cur-pointer), pointer;
    }

    .wallpaper-option img {
      width: 100%;
      height: 62px;
      display: block;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .wallpaper-option span {
      display: block;
      font-size: 11px;
      line-height: 1.2;
      opacity: 0.92;
    }

    .wallpaper-option.active {
      border-color: rgba(133, 211, 255, 0.95);
      box-shadow: 0 0 0 2px rgba(96, 190, 255, 0.32) inset;
      background: rgba(122, 199, 255, 0.14);
    }

    .line {
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
    }

    .line.short { width: 58%; }
    .line.mid { width: 75%; }

    .msg-bubble {
      margin: 8px 0;
      width: fit-content;
      max-width: 88%;
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.35;
    }

    .msg-left {
      background: rgba(255, 255, 255, 0.22);
      color: rgba(246, 250, 255, 0.95);
    }

    .msg-right {
      margin-left: auto;
      background: rgba(81, 212, 108, 0.86);
      color: #103018;
    }

    .app-grid {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .app-chip {
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.32), rgba(255, 255, 255, 0.08));
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .safari-shell {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      height: 100%;
    }

    .safari-toolbar {
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.13);
      padding: 8px;
      display: grid;
      gap: 8px;
    }

    .safari-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .safari-tab {
      height: 24px;
      padding: 0 10px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 11px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: rgba(238, 244, 255, 0.86);
    }

    .safari-tab.active {
      background: rgba(255, 255, 255, 0.18);
      color: rgba(247, 251, 255, 0.96);
    }

    .safari-search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .safari-input {
      height: 30px;
      width: 100%;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(10, 13, 24, 0.40);
      color: rgba(246, 250, 255, 0.95);
      padding: 0 12px;
      font-size: 12px;
      outline: none;
      cursor: var(--cur-text), text;
    }

    .safari-input::placeholder {
      color: rgba(215, 227, 245, 0.72);
    }

    .safari-go {
      height: 30px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: linear-gradient(160deg, rgba(132, 214, 255, 0.42), rgba(58, 121, 226, 0.34));
      color: rgba(246, 250, 255, 0.98);
      font-size: 12px;
      font-weight: 600;
      padding: 0 12px;
      cursor: var(--cur-pointer), pointer;
    }

    .safari-page {
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background:
        linear-gradient(170deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04)),
        rgba(12, 18, 31, 0.58);
      padding: 12px;
    }

    .safari-page h5 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(247, 251, 255, 0.95);
    }

    .safari-page p {
      margin: 0;
      font-size: 12px;
      line-height: 1.45;
      color: rgba(234, 244, 255, 0.88);
    }

    .safari-status {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      font-family: "SF Mono Local", ui-monospace, "Cascadia Mono", "Segoe UI Mono", monospace;
      font-size: 11px;
      color: rgba(173, 220, 255, 0.92);
      word-break: break-all;
    }

    .safari-quick {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      min-width: 64px;
      padding: 0 10px;
      margin: 10px 6px 0 0;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.10);
      color: rgba(243, 249, 255, 0.94);
      font-size: 11px;
      cursor: var(--cur-pointer), pointer;
    }

    .music-cover {
      width: 100%;
      height: 120px;
      border-radius: 12px;
      background: linear-gradient(145deg, #2a3d7c, #3749b5 40%, #e87e7a);
      margin-bottom: 10px;
    }

    .progress {
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.26);
      overflow: hidden;
      margin-top: 10px;
    }

    .progress > span {
      display: block;
      width: 52%;
      height: 100%;
      background: rgba(255, 255, 255, 0.88);
    }

    .widgets {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .widget {
      position: relative;
      padding: 14px;
      border-radius: 18px;
      background:
        linear-gradient(165deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.07) 44%, rgba(255, 255, 255, 0.14)),
        var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(32px) saturate(1.7);
      -webkit-backdrop-filter: blur(32px) saturate(1.7);
      box-shadow: var(--shadow);
      overflow: hidden;
      isolation: isolate;
    }

    .widget::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(80% 40% at 16% -8%, rgba(255, 255, 255, 0.66), transparent 72%);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .widget > * {
      position: relative;
      z-index: 1;
    }

    .widget h3 {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0.55px;
      text-transform: uppercase;
      color: rgba(252, 253, 255, 0.9);
    }

    .weather-temp {
      font-size: 40px;
      font-weight: 600;
      line-height: 1;
    }

    .weather-meta,
    .calendar-note,
    .artist {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .calendar-day {
      font-size: 44px;
      line-height: 1;
      font-weight: 640;
    }

    .media {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 10px;
      align-items: center;
    }

    .album {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: linear-gradient(150deg, #10173b 10%, #284b9d 55%, #e07a73 100%);
      border: 1px solid rgba(255, 255, 255, 0.24);
    }

    .song {
      margin: 0;
      font-size: 14px;
      font-weight: 560;
    }

    .artist {
      margin: 4px 0 0;
      font-size: 12px;
    }

    .dock-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 14px;
      display: grid;
      place-items: center;
      z-index: 60;
      pointer-events: none;
    }

    .dock {
      pointer-events: auto;
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px 12px 7px;
      border-radius: 24px;
      background:
        linear-gradient(165deg, rgba(255, 255, 255, 0.20), rgba(255, 255, 255, 0.04) 42%, rgba(255, 255, 255, 0.08)),
        var(--glass-strong);
      border: 1px solid rgba(255, 255, 255, 0.20);
      backdrop-filter: blur(36px) saturate(1.95);
      -webkit-backdrop-filter: blur(36px) saturate(1.95);
      box-shadow: 0 18px 34px rgba(7, 10, 20, 0.24);
      overflow: hidden;
      isolation: isolate;
    }

    .dock::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(90% 58% at 50% -15%, rgba(255, 255, 255, 0.38), transparent 72%);
      mix-blend-mode: screen;
      z-index: 0;
    }

    .dock > * {
      position: relative;
      z-index: 1;
    }

    .dock-item {
      width: 56px;
      display: grid;
      justify-items: center;
      cursor: var(--cur-pointer), pointer;
    }

    .dock-icon {
      width: 54px;
      height: 54px;
      border-radius: 13px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.26);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.75), 0 10px 18px rgba(0, 0, 0, 0.22);
      transition: transform 180ms ease;
      background: rgba(255, 255, 255, 0.12);
      display: grid;
      place-items: center;
      position: relative;
      font-weight: 700;
      font-size: 17px;
      color: rgba(255, 255, 255, 0.96);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.34);
    }

    .dock-icon img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 150ms ease;
    }

    .dock-icon.img-ok img {
      opacity: 1;
    }

    .dock-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      line-height: 1;
    }

    .dock-icon.img-ok .dock-fallback {
      opacity: 0;
    }

    .app-finder {
      background: linear-gradient(140deg, #7bd8ff, #2d74ff);
    }

    .app-launchpad {
      background: linear-gradient(140deg, #283b66, #121a33);
    }

    .app-safari {
      background: linear-gradient(140deg, #74e8ff, #1a88e2);
    }

    .app-mail {
      background: linear-gradient(140deg, #b5e7ff, #4d9cff);
    }

    .app-messages {
      background: linear-gradient(140deg, #7aff99, #22b957);
    }

    .app-music {
      background: linear-gradient(140deg, #ffb2d4, #ff5f90);
    }

    .app-settings {
      background: linear-gradient(140deg, #e7eef8, #95a0b3);
      color: #273042;
      text-shadow: none;
    }

    .app-trash {
      background: transparent;
      color: rgba(255, 255, 255, 0.96);
      text-shadow: none;
    }

    .dock-item:hover .dock-icon {
      transform: translateY(-6px) scale(1.08);
    }

    .running {
      margin-top: 6px;
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: rgba(236, 243, 255, 0.95);
      box-shadow: 0 0 8px rgba(210, 230, 255, 0.75);
      opacity: 0;
      transform: scale(0.65);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .dock-item.active .running {
      opacity: 1;
      transform: scale(1);
    }

    .sep {
      width: 1px;
      height: 42px;
      margin: 0 2px 6px;
      background: rgba(255, 255, 255, 0.30);
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 98px;
      transform: translateX(-50%);
      font-size: 12px;
      font-family: "SF Mono Local", ui-monospace, "Cascadia Mono", "Segoe UI Mono", monospace;
      color: rgba(255, 255, 255, 0.82);
      text-shadow: 0 2px 7px rgba(0, 0, 0, 0.32);
      z-index: 65;
      cursor: var(--cur-text), text;
    }

    .context-menu {
      position: fixed;
      min-width: 220px;
      max-width: min(320px, 90vw);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      background:
        linear-gradient(170deg, rgba(255, 255, 255, 0.20), rgba(255, 255, 255, 0.05)),
        rgba(18, 24, 40, 0.82);
      backdrop-filter: blur(26px) saturate(1.45);
      -webkit-backdrop-filter: blur(26px) saturate(1.45);
      box-shadow: 0 18px 34px rgba(7, 10, 20, 0.38);
      z-index: 120;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.96);
      transform-origin: top left;
      transition: opacity 120ms ease, transform 120ms ease, visibility 0s linear 120ms;
      pointer-events: none;
    }

    .context-menu.open {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      transition: opacity 120ms ease, transform 120ms ease, visibility 0s linear 0s;
      pointer-events: auto;
    }

    .context-menu-list {
      display: grid;
      gap: 2px;
    }

    .context-menu-item {
      height: 28px;
      border: 0;
      width: 100%;
      border-radius: 8px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
      color: rgba(244, 249, 255, 0.96);
      font-size: 12px;
      letter-spacing: 0.15px;
      text-align: left;
      cursor: var(--cur-pointer), pointer;
    }

    .context-menu-item:hover {
      background: rgba(113, 189, 255, 0.28);
    }

    .context-menu-item:disabled {
      opacity: 0.5;
      cursor: var(--cur-default), default;
    }

    .context-menu-sep {
      height: 1px;
      margin: 4px 6px;
      background: rgba(255, 255, 255, 0.20);
    }

    .context-menu-meta {
      margin-left: 12px;
      font-size: 11px;
      color: rgba(209, 221, 239, 0.82);
    }

    .desktop-marquee {
      position: fixed;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      border-radius: 8px;
      border: 1px solid rgba(141, 206, 255, 0.92);
      background: linear-gradient(165deg, rgba(122, 198, 255, 0.24), rgba(122, 198, 255, 0.08));
      box-shadow: inset 0 0 0 1px rgba(212, 237, 255, 0.24), 0 8px 16px rgba(10, 25, 52, 0.20);
      pointer-events: none;
      z-index: 70;
      opacity: 0;
      visibility: hidden;
      transition: opacity 120ms ease, visibility 0s linear 120ms;
    }

    .desktop-marquee.active {
      opacity: 1;
      visibility: visible;
      transition: opacity 80ms ease, visibility 0s linear 0s;
    }

    .desktop-widgets-layer {
      position: fixed;
      inset: 40px 8px 88px 8px;
      z-index: 54;
      pointer-events: none;
      overflow: hidden;
    }

    .desktop-widget {
      position: absolute;
      width: 230px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background:
        linear-gradient(170deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.05)),
        rgba(22, 31, 51, 0.74);
      backdrop-filter: blur(24px) saturate(1.35);
      -webkit-backdrop-filter: blur(24px) saturate(1.35);
      box-shadow: 0 16px 30px rgba(8, 13, 28, 0.34);
      pointer-events: auto;
      overflow: hidden;
      user-select: none;
      will-change: left, top;
    }

    .desktop-widget.dragging {
      box-shadow: 0 22px 40px rgba(8, 13, 28, 0.42);
    }

    .desktop-widget-head {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 8px 0 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      cursor: var(--cur-grab), grab;
    }

    .desktop-widget.dragging .desktop-widget-head {
      cursor: var(--cur-grabbing), grabbing;
    }

    .desktop-widget-title {
      font-size: 11px;
      letter-spacing: 0.3px;
      color: rgba(242, 248, 255, 0.92);
      text-transform: uppercase;
      font-weight: 600;
    }

    .desktop-widget-close {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: 0;
      background: rgba(255, 95, 87, 0.95);
      color: rgba(26, 8, 8, 0.75);
      font-size: 12px;
      line-height: 1;
      cursor: var(--cur-pointer), pointer;
    }

    .desktop-widget-body {
      padding: 10px;
      min-height: 92px;
      display: grid;
      gap: 6px;
      align-content: start;
    }

    .widget-weather-temp {
      font-size: 30px;
      line-height: 1;
      font-weight: 600;
      color: rgba(247, 251, 255, 0.98);
      text-shadow: 0 3px 10px rgba(8, 13, 26, 0.30);
    }

    .widget-weather-meta,
    .widget-clock-date {
      font-size: 12px;
      color: rgba(219, 233, 248, 0.9);
      line-height: 1.35;
    }

    .widget-clock-time {
      font-size: 34px;
      line-height: 1;
      font-weight: 560;
      color: rgba(246, 251, 255, 0.98);
      text-shadow: 0 4px 12px rgba(8, 13, 26, 0.30);
    }

    .widgets-panel {
      position: fixed;
      min-width: 300px;
      max-width: min(360px, 92vw);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      background:
        linear-gradient(170deg, rgba(255, 255, 255, 0.20), rgba(255, 255, 255, 0.05)),
        rgba(19, 26, 43, 0.86);
      backdrop-filter: blur(28px) saturate(1.45);
      -webkit-backdrop-filter: blur(28px) saturate(1.45);
      box-shadow: 0 18px 36px rgba(7, 10, 20, 0.4);
      z-index: 121;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.96);
      transform-origin: top left;
      transition: opacity 120ms ease, transform 120ms ease, visibility 0s linear 120ms;
      pointer-events: none;
      overflow: hidden;
    }

    .widgets-panel.open {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      transition: opacity 120ms ease, transform 120ms ease, visibility 0s linear 0s;
      pointer-events: auto;
    }

    .widgets-panel-head {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
    }

    .widgets-panel-head h4 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: rgba(246, 251, 255, 0.96);
      letter-spacing: 0.2px;
    }

    .widgets-panel-close {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: 0;
      background: rgba(255, 95, 87, 0.95);
      font-size: 12px;
      cursor: var(--cur-pointer), pointer;
    }

    .widgets-panel-list {
      padding: 8px;
      display: grid;
      gap: 6px;
      max-height: 58vh;
      overflow: auto;
    }

    .widgets-panel-item {
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.08);
      display: grid;
      gap: 6px;
    }

    .widgets-panel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .widgets-panel-name {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      color: rgba(245, 250, 255, 0.96);
    }

    .widgets-panel-desc {
      margin: 0;
      font-size: 11px;
      line-height: 1.35;
      color: rgba(208, 224, 241, 0.9);
    }

    .widgets-panel-action {
      height: 26px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.12);
      color: rgba(244, 250, 255, 0.96);
      font-size: 11px;
      padding: 0 10px;
      cursor: var(--cur-pointer), pointer;
      white-space: nowrap;
    }

    .dot-max {
      cursor: var(--cur-zoom-in), zoom-in;
    }

    .app-window.maximized .dot-max {
      cursor: var(--cur-zoom-out), zoom-out;
    }

    .resize-handle {
      position: absolute;
      z-index: 4;
      pointer-events: auto;
    }

    .rh-n {
      top: 0;
      left: 10px;
      right: 10px;
      height: 8px;
      cursor: var(--cur-ns-resize), ns-resize;
    }

    .rh-s {
      bottom: 0;
      left: 10px;
      right: 10px;
      height: 8px;
      cursor: var(--cur-row-resize), ns-resize;
    }

    .rh-e {
      top: 10px;
      right: 0;
      bottom: 10px;
      width: 8px;
      cursor: var(--cur-col-resize), ew-resize;
    }

    .rh-w {
      top: 10px;
      left: 0;
      bottom: 10px;
      width: 8px;
      cursor: var(--cur-ew-resize), ew-resize;
    }

    .rh-ne {
      top: 0;
      right: 0;
      width: 12px;
      height: 12px;
      cursor: var(--cur-nesw-resize), nesw-resize;
    }

    .rh-nw {
      top: 0;
      left: 0;
      width: 12px;
      height: 12px;
      cursor: var(--cur-nwse-resize), nwse-resize;
    }

    .rh-se {
      bottom: 0;
      right: 0;
      width: 12px;
      height: 12px;
      cursor: var(--cur-nwse-resize), nwse-resize;
    }

    .rh-sw {
      bottom: 0;
      left: 0;
      width: 12px;
      height: 12px;
      cursor: var(--cur-nesw-resize), nesw-resize;
    }

    @keyframes sheen {
      0% {
        transform: translateX(-130%);
      }
      100% {
        transform: translateX(130%);
      }
    }

    @keyframes appOpen {
      0% {
        opacity: 0;
        transform: translate(var(--open-x, 0px), var(--open-y, 0px)) scale(0.9);
      }
      72% {
        opacity: 1;
        transform: translate(0, 0) scale(1.01);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
    }

    @keyframes appClose {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(0.88);
      }
    }

    @keyframes appMinimize {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--to-x, 0px), var(--to-y, 0px)) scale(0.18);
      }
    }

    @keyframes appRestore {
      0% {
        opacity: 0;
        transform: translate(var(--from-x, 0px), var(--from-y, 0px)) scale(0.18);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .menu-bar::after {
        animation: none;
      }
      .dock-item:hover .dock-icon {
        transform: none;
      }
      .app-window.frame-animating {
        transition: none;
      }
    }

    @media (max-width: 980px) {
      .desktop-widgets-layer {
        inset: 40px 6px 82px 6px;
      }

      .window-stage {
        inset: 36px 0 82px;
      }

      .app-window {
        --win-w: min(94vw, 760px);
        --win-h: min(58vh, 500px);
      }

      .dock {
        gap: 8px;
      }

      .dock-item {
        width: 50px;
      }

      .dock-icon {
        width: 48px;
        height: 48px;
      }

      .hint {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .desktop {
        padding-left: 12px;
        padding-right: 12px;
      }

      .center {
        align-content: start;
        padding-top: 46px;
      }

      .hero-time {
        font-size: 72px;
      }

      .hero-date {
        font-size: 20px;
      }

      .window-stage {
        inset: 36px 0 80px;
      }

      .desktop-widgets-layer {
        inset: 38px 4px 78px 4px;
      }

      .app-window {
        --win-w: 95vw;
        --win-h: min(62vh, 440px);

      <div class="dock-item" title="Trash" data-app="trash">

                  <button type="button" class="settings-save" data-save-city>Save</button>

              </div>

            <article class="preview-card"><h4>Privacy & Security</h4><p>Firewall enabled, app permissions managed.</p></article>
            <article class="preview-card"><h4>Network</h4><p>Wi-Fi connected, VPN disconnected.</p></article>

        `,
        trash: `
          <div class="preview-grid">
            <article class="preview-card preview-span-2">
              <h4>Trash</h4>
              <p>Trash is currently empty.</p>
            </article>
          </div>
