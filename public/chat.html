                            ? `<button type="button" class="message-action" data-friend-add-id="${escapeHtml(msg.userId || '')}" data-friend-add-name="${escapeHtml(msg.username || 'user')}">friend</button>`
                            : ''
                        }
                    </div>
                </article>
            `).join('');
            messageListEl.insertAdjacentHTML('beforeend', html);
            messageListEl.querySelectorAll('[data-reply-id]').forEach((button) => {
                button.addEventListener('click', () => {
                    const replyId = String(button.getAttribute('data-reply-id') || '');
                    const roomMessages = getRoomMessageIndex(state.activeRoomId);
                    const target = roomMessages[replyId];
                    if (target) {
                        setReplyTarget(target);
                        if (messageInput) messageInput.focus();
                    }
                });
            });
            messageListEl.querySelectorAll('[data-dm-user-id]').forEach((button) => {
                button.addEventListener('click', async () => {
                    const targetUserId = String(button.getAttribute('data-dm-user-id') || '');
                    const targetUsername = String(button.getAttribute('data-dm-username') || '');
                    await openProfileModal(targetUserId, targetUsername);
                });
            });
            messageListEl.querySelectorAll('[data-friend-add-id]').forEach((button) => {
                button.addEventListener('click', async () => {
                    const targetUserId = String(button.getAttribute('data-friend-add-id') || '');
                    const targetUsername = String(button.getAttribute('data-friend-add-name') || '');
                    try {
                        await updateFriend('add', targetUserId, targetUsername);
                        setFriendStatus(`added ${targetUsername}`);
                    } catch (error) {
                        setFriendStatus(error?.message || 'add failed');
                    }
                });
            });
            messageListEl.querySelectorAll('[data-react-id]').forEach((button) => {
                button.addEventListener('click', async () => {
                    const messageId = String(button.getAttribute('data-react-id') || '');
                    const emoji = String(button.getAttribute('data-react-emoji') || '');
                    await reactToMessage(messageId, emoji);
                });
            });
            messageListEl.querySelectorAll('[data-pin-id]').forEach((button) => {
                button.addEventListener('click', async () => {
                    const messageId = String(button.getAttribute('data-pin-id') || '');
                    const isPinned = Array.isArray(state.pinsByRoom[roomId]) && state.pinsByRoom[roomId].some((entry) => String(entry?.id || '') === messageId);
                    await updatePinState(messageId, isPinned ? 'unpin' : 'pin');
                });
            });
            messageListEl.scrollTop = messageListEl.scrollHeight;
        }

        async function reactToMessage(messageId, emoji) {
            const room = getActiveRoom();
            if (!room || !messageId || !emoji) return;
            const password = room.isPrivate ? getRoomPassword(room) : '';
            try {
                await apiRequest('/api/chat/reactions', {
                    method: 'POST',
                    body: JSON.stringify({
                        room: room.id,
                        messageId,
                        emoji,
                        password: password || '',
                    }),
                });
                await fetchMessages({ reset: true });
            } catch (error) {
                activeRoomMetaEl.textContent = error.message || 'reaction failed';
            }
        }

        async function updatePinState(messageId, action = 'pin') {
            const room = getActiveRoom();
            if (!room || !messageId) return;
            const password = room.isPrivate ? getRoomPassword(room) : '';
            try {
                const payload = await apiRequest('/api/chat/pins', {
                    method: 'POST',
                    body: JSON.stringify({
                        room: room.id,
                        messageId,
                        action,
                        password: password || '',
                    }),
                });
                state.pinsByRoom[room.id] = Array.isArray(payload?.pins) ? payload.pins : [];
                state.canPinByRoom[room.id] = !!payload?.canPin;
                renderPinnedPanel(room.id);
                await fetchMessages({ reset: true });
            } catch (error) {
                activeRoomMetaEl.textContent = error.message || 'pin update failed';
            }
        }

        function showRoomGate(room, errorText) {
            if (!room || !room.isPrivate) return;
            messageListEl.innerHTML = `
                <div class="room-gate">
                    <form id="roomGateForm" class="room-gate-card">
                        <div class="room-gate-title">join private room: #${escapeHtml(room.name)}</div>
                        <div class="room-gate-note">enter room password to load chat messages.</div>
                        <input id="roomGatePassword" class="chat-input" type="password" maxlength="64" placeholder="room password" required>
                        <div class="room-gate-error">${escapeHtml(errorText || '')}</div>
                        <button class="chat-btn" type="submit">join room</button>
                    </form>
                </div>
            `;
            const form = document.getElementById('roomGateForm');
            const input = document.getElementById('roomGatePassword');
            if (input) input.focus();
            if (form) {
                form.addEventListener('submit', async (event) => {
                    event.preventDefault();
                    const value = String(input?.value || '').trim();
                    if (!value) return;
                    state.knownRoomPasswords[room.id] = value;
                    await fetchMessages({ reset: true });
                });
            }
        }

        async function fetchRooms() {
            const payload = await apiRequest('/api/chat/rooms');
            state.rooms = Array.isArray(payload.rooms) ? payload.rooms : [];
            if (!state.rooms.some((room) => room.id === state.activeRoomId)) {
                state.activeRoomId = state.rooms.length ? state.rooms[0].id : 'lobby';
            }
            if (state.call.active && !state.rooms.some((room) => room.id === state.call.roomId)) {
                await leaveCall();
            }
            renderRooms();
            setActiveRoomHeader(state.rooms.find((room) => room.id === state.activeRoomId));
        }

        async function fetchMessages({ reset = false } = {}) {
            const room = state.rooms.find((entry) => entry.id === state.activeRoomId);
            if (!room) return;
            if (reset) {
                state.sinceByRoom[room.id] = 0;
                messageListEl.innerHTML = '';
                state.messageIndexByRoom[room.id] = {};
                clearReplyTarget();
            }

            const since = state.sinceByRoom[room.id] || 0;
            const params = new URLSearchParams({ room: room.id });
            if (since > 0) params.set('since', String(since));
            const password = getRoomPassword(room);
            if (room.isPrivate) {
                if (!password && !isRiftAdminClient()) {
                    showRoomGate(room, '');
                    return;
                }
                if (password) params.set('password', password);
            }

            try {
                const payload = await apiRequest(`/api/chat/messages?${params.toString()}`);
                const messages = Array.isArray(payload.messages) ? payload.messages : [];
                state.pinsByRoom[room.id] = Array.isArray(payload.pins) ? payload.pins : [];
                state.canPinByRoom[room.id] = !!payload.canPin;
                renderPinnedPanel(room.id);
                appendMessages(messages);
                if (messages.length) {
                    const last = messages[messages.length - 1];
                    state.sinceByRoom[room.id] = Number(last.createdAt) || Date.now();
                }
            } catch (error) {
                if (error.status === 403 && room.isPrivate) {
                    clearRoomPassword(room.id);
                    activeRoomMetaEl.textContent = 'wrong password, try again';
                    showRoomGate(room, 'wrong password');
                    return;
                }
                activeRoomMetaEl.textContent = error.message || 'failed to load messages';
            }
        }

        async function selectRoom(roomId) {
            if (!roomId) return;
            const previousRoom = getActiveRoom();
            if (previousRoom && previousRoom.id !== roomId) {
                await sendTyping(false);
                state.typingByRoom[previousRoom.id] = [];
            }
            if (state.call.active && state.call.roomId && state.call.roomId !== roomId) {
                await leaveCall();
            }
            state.activeRoomId = roomId;
            clearReplyTarget();
            renderRooms();
            const room = state.rooms.find((entry) => entry.id === roomId);
            setActiveRoomHeader(room);
            await fetchMessages({ reset: true });
            await pollTyping();
        }

        async function createRoom(event) {
            event.preventDefault();
            const name = roomNameInput.value.trim();
            const isPrivate = roomTypeInput.value === 'private';
            const password = roomPasswordInput.value;

            if (!name) {
                setCreateStatus('room name required');
                return;
            }
            if (isPrivate && password.length < 4) {
                setCreateStatus('private room password must be 4+ chars');
                return;
            }

            try {
                const payload = await apiRequest('/api/chat/rooms', {
                    method: 'POST',
                    body: JSON.stringify({
                        name,
                        isPrivate,
                        password: isPrivate ? password : '',
                    }),
                });
                const room = payload.room;
                if (room && room.isPrivate && password) {
                    state.knownRoomPasswords[room.id] = password;
                }
                roomNameInput.value = '';
                roomPasswordInput.value = '';
                setCreateStatus('room created');
                await fetchRooms();
                if (room && room.id) {
                    await selectRoom(room.id);
                }
            } catch (error) {
                setCreateStatus(error.message || 'room create failed');
            }
        }

        async function sendMessage(event) {
            event.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;
            const room = state.rooms.find((entry) => entry.id === state.activeRoomId);
            if (!room) return;
            const password = room.isPrivate ? getRoomPassword(room) : '';
            if (room.isPrivate && !password && !isRiftAdminClient()) {
                showRoomGate(room, '');
                return;
            }

            try {
                await apiRequest('/api/chat/messages', {
                    method: 'POST',
                    body: JSON.stringify({
                        room: room.id,
                        text,
                        password: password || '',
                        clientMode: getClientMode(),
                        replyToId: state.replyTarget?.id || '',
                    }),
                });
                messageInput.value = '';
                clearReplyTarget();
                await sendTyping(false);
                await fetchMessages();
            } catch (error) {
                if (error.status === 403 && room.isPrivate) {
                    clearRoomPassword(room.id);
                    activeRoomMetaEl.textContent = 'wrong password, try again';
                    showRoomGate(room, 'wrong password');
                    return;
                }
                activeRoomMetaEl.textContent = error.message || 'send failed';
            }
        }

        async function deleteActiveRoom() {
            const room = state.rooms.find((entry) => entry.id === state.activeRoomId);
            if (!canDeleteRoom(room)) return;
            const confirmed = window.confirm(`Delete #${room.name}?`);
            if (!confirmed) return;
            if (state.call.active && state.call.roomId === room.id) {
                await leaveCall();
            }
            try {
                await apiRequest(`/api/chat/rooms/${encodeURIComponent(room.id)}`, {
                    method: 'DELETE',
                });
                activeRoomMetaEl.textContent = `#${room.name} deleted`;
                state.activeRoomId = 'lobby';
                await fetchRooms();
                await selectRoom(state.activeRoomId);
            } catch (error) {
                activeRoomMetaEl.textContent = error.message || 'delete failed';
            }
        }

        async function sendTyping(typing) {
            const room = getActiveRoom();
            if (!room) return;
            const now = Date.now();
            if (typing && (now - Number(state.typing.lastSentAt || 0)) < 1200 && state.typing.activeRoomId === room.id) {
                return;
            }
            const password = room.isPrivate ? getRoomPassword(room) : '';
            try {
                await apiRequest('/api/chat/typing', {
                    method: 'POST',
                    body: JSON.stringify({
                        room: room.id,
                        typing: !!typing,
                        password: password || '',
                        clientMode: getClientMode(),
                    }),
                });
                state.typing.lastSentAt = now;
                state.typing.activeRoomId = typing ? room.id : '';
            } catch {
            }
        }

        function scheduleTypingStop() {
            if (state.typing.timeout) clearTimeout(state.typing.timeout);
            state.typing.timeout = setTimeout(() => {
                sendTyping(false);
            }, 1900);
        }

        async function pollTyping() {
            const room = getActiveRoom();
            if (!room) return;
            const password = room.isPrivate ? getRoomPassword(room) : '';
            const params = new URLSearchParams({ room: room.id });
            if (password) params.set('password', password);
            try {
                const payload = await apiRequest(`/api/chat/typing?${params.toString()}`);
                state.typingByRoom[room.id] = Array.isArray(payload?.typing) ? payload.typing : [];
                renderTypingIndicator(room.id);
            } catch {
                state.typingByRoom[room.id] = [];
                renderTypingIndicator(room.id);
            }
        }

        function startPolling() {
            if (state.pollTimer) clearInterval(state.pollTimer);
            state.pollTimer = setInterval(async () => {
                await fetchMessages();
            }, 3000);
            if (state.roomPollTimer) clearInterval(state.roomPollTimer);
            state.roomPollTimer = setInterval(async () => {
                await fetchRooms();
            }, 5000);
            if (state.typingPollTimer) clearInterval(state.typingPollTimer);
            state.typingPollTimer = setInterval(async () => {
                await pollTyping();
            }, 1500);
            if (state.friendPollTimer) clearInterval(state.friendPollTimer);
            state.friendPollTimer = setInterval(async () => {
                await fetchFriends();
            }, 7000);
        }

        roomTypeInput.addEventListener('change', () => {
            const isPrivate = roomTypeInput.value === 'private';
            roomPasswordInput.style.display = isPrivate ? '' : 'none';
            roomPasswordInput.required = isPrivate;
            if (!isPrivate) roomPasswordInput.value = '';
        });

        document.getElementById('createRoomForm').addEventListener('submit', createRoom);
        document.getElementById('messageForm').addEventListener('submit', sendMessage);
        if (friendAddBtn && friendInput) {
            friendAddBtn.addEventListener('click', async () => {
                const username = normalizeFriendUsername(friendInput.value || '');
                if (!username || username.length < 3) {
                    setFriendStatus('enter a valid username');
                    return;
                }
                try {
                    await updateFriend('add', '', username);
                    setFriendStatus(`added ${username}`);
                    friendInput.value = '';
                } catch (error) {
                    setFriendStatus(error?.message || 'add failed');
                }
            });
            friendInput.addEventListener('keydown', (event) => {
                if (event.key !== 'Enter') return;
                event.preventDefault();
                friendAddBtn.click();
            });
        }
        messageInput.addEventListener('input', () => {
            const hasText = String(messageInput.value || '').trim().length > 0;
            if (!hasText) {
                if (state.typing.timeout) {
                    clearTimeout(state.typing.timeout);
                    state.typing.timeout = null;
                }
                sendTyping(false);
                return;
            }
            sendTyping(true);
            scheduleTypingStop();
        });
        deleteRoomBtn.addEventListener('click', deleteActiveRoom);
        voiceCallBtn.addEventListener('click', () => { startCall({ video: false }); });
        videoCallBtn.addEventListener('click', () => { startCall({ video: true }); });
        leaveCallBtn.addEventListener('click', () => { leaveCall(); });
        profileModalCloseEl?.addEventListener('click', closeProfileModal);
        profileModalBackdropEl?.addEventListener('click', (event) => {
            if (event.target === profileModalBackdropEl) closeProfileModal();
        });
        profileModalDmEl?.addEventListener('click', async () => {
            const target = state.profileTarget;
            if (!target) return;
            await openDmWithUser(target.userId, target.username);
            closeProfileModal();
        });
        profileModalFriendEl?.addEventListener('click', async () => {
            const target = state.profileTarget;
            if (!target) return;
            try {
                await updateFriend('add', target.userId, target.username);
                setFriendStatus(`added ${target.username}`);
            } catch (error) {
                setFriendStatus(error?.message || 'add failed');
            }
        });
        profileModalBlockEl?.addEventListener('click', async () => {
            const target = state.profileTarget;
            if (!target) return;
            try {
                await updateFriend('block', target.userId, target.username);
                setFriendStatus(`blocked ${target.username}`);
                closeProfileModal();
            } catch (error) {
                setFriendStatus(error?.message || 'block failed');
            }
        });
        profileModalInviteEl?.addEventListener('click', async () => {
            const target = state.profileTarget;
            if (!target) return;
            await inviteFriendToActiveRoom(target.userId, target.username);
        });
        window.addEventListener('beforeunload', () => {
            if (!state.call.active || !state.call.roomId) return;
            if (navigator.sendBeacon) {
                navigator.sendBeacon('/api/chat/call/leave', new Blob([JSON.stringify({ room: state.call.roomId })], { type: 'application/json' }));
            }
            if (navigator.sendBeacon) {
                const room = getActiveRoom();
                if (room) {
                    navigator.sendBeacon('/api/chat/typing', new Blob([JSON.stringify({ room: room.id, typing: false })], { type: 'application/json' }));
                }
            }
        });

        (async function initChat() {
            const ok = await requireAuth();
            if (!ok) return;
            await fetchRooms();
            await fetchFriends();
            try {
                const requestedRoom = normalizeRoomName(new URLSearchParams(window.location.search || '').get('room'));
                if (requestedRoom && state.rooms.some((room) => room.id === requestedRoom)) {
                    state.activeRoomId = requestedRoom;
                }
            } catch {}
            await selectRoom(state.activeRoomId);
            startPolling();
        })();
    </script>
</body>
</html>
