<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W1SEMRGLRR"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-W1SEMRGLRR');
    </script><title>Rift Chat</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="/global/css/global.css">
    <style>
        .chat-shell {
            width: min(94vw, 1080px);
            height: min(72vh, 760px);
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 14px;
        }

        .chat-panel {
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            min-height: 0;
        }

        .rooms-panel {
            display: grid;
            grid-template-rows: auto auto 1fr;
            overflow: hidden;
        }

        .panel-title {
            padding: 14px 16px 8px;
            color: #fff;
            font-size: 14px;
            text-transform: lowercase;
            letter-spacing: 0.08em;
        }

        .panel-sub {
            color: rgba(255, 255, 255, 0.62);
            font-size: 11px;
            margin-top: 4px;
            line-height: 1.5;
        }

        .create-room {
            padding: 10px 16px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: grid;
            gap: 8px;
        }

        .chat-input,
        .chat-select {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(0, 0, 0, 0.32);
            color: #fff;
            border-radius: 10px;
            padding: 9px 10px;
            font-family: "Run", Arial, sans-serif;
            font-size: 12px;
            outline: none;
        }

        .chat-select option {
            background: #151515;
            color: #fff;
        }

        .chat-input:focus,
        .chat-select:focus {
            border-color: rgba(255, 255, 255, 0.36);
            background: rgba(255, 255, 255, 0.08);
        }

        .chat-btn {
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.09);
            color: white;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            font-family: "Run", Arial, sans-serif;
            font-size: 12px;
            text-transform: lowercase;
        }

        .chat-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .room-list {
            display: grid;
            gap: 8px;
            align-content: start;
        }
        .room-sections {
            overflow: auto;
            padding: 12px;
            display: grid;
            gap: 12px;
            align-content: start;
        }
        .room-section-title {
            color: rgba(255, 255, 255, 0.76);
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: lowercase;
            margin-bottom: 6px;
        }
        .room-empty {
            color: rgba(255, 255, 255, 0.52);
            font-size: 10px;
            text-transform: lowercase;
            padding: 2px 0;
        }
        .presence-item {
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 7px 8px;
            display: grid;
            gap: 5px;
        }
        .presence-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .presence-name {
            color: #fff;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }
        .presence-meta {
            color: rgba(255, 255, 255, 0.64);
            font-size: 10px;
            text-transform: lowercase;
        }
        .presence-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .presence-btn {
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-radius: 8px;
            padding: 3px 7px;
            font-family: "Run", Arial, sans-serif;
            font-size: 10px;
            cursor: pointer;
            text-transform: lowercase;
        }
        .presence-btn:hover {
            background: rgba(255, 255, 255, 0.14);
        }
        .friend-add {
            display: grid;
            gap: 6px;
            margin-bottom: 8px;
        }
        .friend-add-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px;
            align-items: center;
        }
        .presence-btn.danger {
            border-color: rgba(255, 120, 120, 0.45);
            background: rgba(255, 82, 82, 0.16);
        }
        .presence-btn.danger:hover {
            background: rgba(255, 82, 82, 0.26);
        }

        .room-item {
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.82);
            padding: 9px 10px;
            cursor: pointer;
            text-align: left;
            display: grid;
            gap: 4px;
            font-family: "Run", Arial, sans-serif;
        }

        .room-item.active {
            border-color: rgba(255, 255, 255, 0.38);
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
        }

        .room-name {
            font-size: 12px;
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .room-meta {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.56);
        }

        .chat-main {
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            min-height: 0;
        }

        .chat-head {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .chat-head-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-head-title {
            color: #fff;
            font-size: 14px;
            text-transform: lowercase;
            letter-spacing: 0.06em;
            word-break: break-word;
        }

        .chat-head-meta {
            color: rgba(255, 255, 255, 0.58);
            font-size: 11px;
        }

        .message-list {
            min-height: 0;
            overflow: auto;
            padding: 12px 14px;
            display: grid;
            gap: 8px;
            align-content: start;
        }
        .room-gate {
            min-height: 100%;
            display: grid;
            place-items: center;
            padding: 18px;
        }
        .room-gate-card {
            width: min(420px, 100%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            padding: 14px;
            display: grid;
            gap: 10px;
        }
        .room-gate-title {
            color: #fff;
            font-size: 13px;
            text-transform: lowercase;
            letter-spacing: 0.06em;
        }
        .room-gate-note {
            color: rgba(255, 255, 255, 0.64);
            font-size: 11px;
            line-height: 1.45;
        }
        .room-gate-error {
            color: #ff9b9b;
            font-size: 11px;
            min-height: 14px;
        }

        .message {
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 8px 10px;
            word-break: break-word;
        }

        .message-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 10px;
        }

        .message-user {
            color: #fff;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }
        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            display: inline-block;
            flex: 0 0 auto;
            background: #8f8f8f;
        }
        .status-dot.online {
            background: #3ddc84;
        }
        .status-dot.idle {
            background: #f5c451;
        }
        .status-dot.dnd {
            background: #ff5b5b;
        }
        .status-dot.offline {
            background: #9b9b9b;
            box-shadow: 0 0 7px rgba(182, 182, 182, 0.65);
        }
        .message-user-btn {
            border: none;
            background: transparent;
            color: #fff;
            font-size: 11px;
            padding: 0;
            margin: 0;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .message-user-btn:hover {
            text-decoration: underline;
        }

        .message-text {
            color: rgba(255, 255, 255, 0.88);
            font-size: 12px;
            line-height: 1.45;
            white-space: pre-wrap;
        }
        .message-reactions {
            margin-top: 6px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .message-reaction {
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.86);
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 10px;
            cursor: pointer;
        }
        .message-reaction.me {
            border-color: rgba(61, 220, 132, 0.9);
            background: rgba(61, 220, 132, 0.18);
            color: #fff;
        }
        .message-reaction.quick {
            opacity: 0.72;
        }
        .message-reaction:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.14);
        }

        .message-actions {
            margin-top: 6px;
            display: flex;
            justify-content: flex-end;
            gap: 6px;
        }

        .message-action {
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.82);
            border-radius: 8px;
            padding: 4px 8px;
            font-family: "Run", Arial, sans-serif;
            font-size: 10px;
            cursor: pointer;
            text-transform: lowercase;
        }

        .message-action:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
        }

        .message-reply-preview {
            margin-bottom: 6px;
            padding: 6px 8px;
            border-left: 2px solid rgba(255, 255, 255, 0.26);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.72);
            display: grid;
            gap: 3px;
        }

        .message-reply-author {
            color: rgba(255, 255, 255, 0.88);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .reply-compose {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 12px 0;
        }

        .reply-compose-card {
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 7px 8px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
        }

        .reply-compose-meta {
            min-width: 0;
            display: grid;
            gap: 2px;
        }

        .reply-compose-title {
            color: rgba(255, 255, 255, 0.86);
            font-size: 10px;
            text-transform: lowercase;
        }

        .reply-compose-text {
            color: rgba(255, 255, 255, 0.66);
            font-size: 10px;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .reply-compose-close {
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-radius: 8px;
            padding: 3px 7px;
            cursor: pointer;
            font-size: 10px;
            text-transform: lowercase;
        }

        .chat-compose {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 12px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
        }

        .chat-status {
            color: rgba(255, 255, 255, 0.64);
            font-size: 11px;
            margin-top: 2px;
            min-height: 16px;
            text-transform: lowercase;
        }
        .room-kind {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.65);
            text-transform: lowercase;
        }
        .call-panel {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 10px;
            display: grid;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
        }
        .call-participants {
            color: rgba(255, 255, 255, 0.76);
            font-size: 11px;
            text-transform: lowercase;
            line-height: 1.4;
        }
        .call-media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 8px;
        }
        .call-media-card {
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.22);
            padding: 6px;
            display: grid;
            gap: 5px;
        }
        .call-media-card video {
            width: 100%;
            aspect-ratio: 16 / 10;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.45);
            object-fit: cover;
        }
        .call-media-label {
            color: rgba(255, 255, 255, 0.82);
            font-size: 10px;
            text-transform: lowercase;
        }
        .pinned-panel {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 10px;
            display: grid;
            gap: 7px;
        }
        .pinned-title {
            color: rgba(255, 255, 255, 0.75);
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: lowercase;
        }
        .pinned-list {
            display: grid;
            gap: 6px;
        }
        .pinned-item {
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 7px;
            display: grid;
            gap: 3px;
        }
        .pinned-meta {
            color: rgba(255, 255, 255, 0.78);
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .pinned-text {
            color: rgba(255, 255, 255, 0.73);
            font-size: 10px;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        .typing-indicator {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 10px;
            min-height: 16px;
            color: rgba(255, 255, 255, 0.68);
            font-size: 10px;
            text-transform: lowercase;
        }
        .profile-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.56);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 18000;
            padding: 16px;
        }
        .profile-modal-backdrop.active {
            display: flex;
        }
        .profile-modal {
            width: min(680px, 96vw);
            max-height: 88vh;
            overflow: auto;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            background: rgba(10, 13, 19, 0.94);
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.55);
            padding: 14px;
            display: grid;
            gap: 10px;
        }
        .profile-modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .profile-modal-title {
            color: #fff;
            font-size: 13px;
            text-transform: lowercase;
            letter-spacing: 0.08em;
        }
        .profile-modal-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }
        .profile-modal-card {
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            padding: 9px;
            display: grid;
            gap: 5px;
        }
        .profile-modal-card.full {
            grid-column: 1 / -1;
        }
        .profile-modal-label {
            color: rgba(255, 255, 255, 0.62);
            font-size: 10px;
            text-transform: lowercase;
            letter-spacing: 0.06em;
        }
        .profile-modal-value {
            color: #fff;
            font-size: 11px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .profile-modal-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .profile-modal-badge {
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            padding: 3px 8px;
            color: rgba(255, 255, 255, 0.86);
            font-size: 10px;
            text-transform: lowercase;
        }
        .profile-modal-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .frame-none {}
        .frame-pulse { animation: profileFramePulse 1.8s ease-in-out infinite; }
        .frame-glow { box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 0 16px rgba(142,203,255,.36); }
        .frame-orbit { position: relative; overflow: hidden; }
        .frame-orbit::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 999px;
            background: rgba(142, 203, 255, 0.45);
            top: -8px;
            left: -8px;
            animation: profileOrbit 2.6s linear infinite;
            pointer-events: none;
        }
        .accent-none {}
        .accent-shimmer { animation: profileAccentShimmer 1.6s linear infinite; }
        .accent-breathe { animation: profileAccentBreathe 2.1s ease-in-out infinite; }
        .accent-wave { animation: profileAccentWave 1.4s ease-in-out infinite; }
        @keyframes profileFramePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.01); }
        }
        @keyframes profileOrbit {
            0% { transform: translate(0, 0); }
            25% { transform: translate(calc(100% + 8px), 0); }
            50% { transform: translate(calc(100% + 8px), calc(100% + 8px)); }
            75% { transform: translate(0, calc(100% + 8px)); }
            100% { transform: translate(0, 0); }
        }
        @keyframes profileAccentShimmer {
            0% { opacity: .72; filter: brightness(1); }
            50% { opacity: 1; filter: brightness(1.26); }
            100% { opacity: .72; filter: brightness(1); }
        }
        @keyframes profileAccentBreathe {
            0%, 100% { letter-spacing: 0; }
            50% { letter-spacing: .03em; }
        }
        @keyframes profileAccentWave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-1px); }
        }

        @media (max-width: 900px) {
            .chat-shell {
                grid-template-columns: 1fr;
                height: min(76vh, 900px);
            }

            .rooms-panel {
                max-height: 320px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>rift chat</h1>
            <p class="page-subtitle">public + private rooms</p>
        </header>

        <section class="chat-shell">
            <aside class="chat-panel rooms-panel">
                <div class="panel-title">
                    chatrooms
                    <div class="panel-sub">create public/private rooms, then join from this list.</div>
                </div>
                <form id="createRoomForm" class="create-room">
                    <input id="roomNameInput" class="chat-input" maxlength="40" placeholder="unique room name" required>
                    <select id="roomTypeInput" class="chat-select" aria-label="room type">
                        <option value="public">public</option>
                        <option value="private">private</option>
                    </select>
                    <input id="roomPasswordInput" class="chat-input" type="password" maxlength="64" placeholder="password (private only)" style="display:none;">
                    <button type="submit" class="chat-btn">create room</button>
                    <div id="roomCreateStatus" class="chat-status"></div>
                </form>
                <div class="room-sections">
                    <section>
                        <div class="room-section-title">chatrooms</div>
                        <div id="roomListRooms" class="room-list"></div>
                    </section>
                    <section>
                        <div class="room-section-title">dms</div>
                        <div id="roomListDms" class="room-list"></div>
                    </section>
                    <section>
                        <div class="room-section-title">presence</div>
                        <div id="dmPresenceList" class="room-list"></div>
                    </section>
                    <section>
                        <div class="room-section-title">friends</div>
                        <div class="friend-add">
                            <div class="friend-add-row">
                                <input id="friendInput" class="chat-input" maxlength="24" placeholder="friend username">
                                <button type="button" id="friendAddBtn" class="presence-btn">add</button>
                            </div>
                            <div id="friendStatus" class="chat-status"></div>
                        </div>
                        <div id="friendList" class="room-list"></div>
                    </section>
                    <section>
                        <div class="room-section-title">blocked</div>
                        <div id="blockedList" class="room-list"></div>
                    </section>
                </div>
            </aside>

            <section class="chat-panel chat-main">
                <div class="chat-head">
                    <div>
                        <div id="activeRoomName" class="chat-head-title"># lobby</div>
                        <div id="activeRoomMeta" class="chat-head-meta">select a room to chat</div>
                        <div id="callMeta" class="chat-head-meta"></div>
                    </div>
                    <div class="chat-head-actions">
                        <button id="voiceCallBtn" type="button" class="chat-btn">voice call</button>
                        <button id="videoCallBtn" type="button" class="chat-btn" style="display:none;">video call</button>
                        <button id="leaveCallBtn" type="button" class="chat-btn" style="display:none;">leave call</button>
                        <button id="deleteRoomBtn" type="button" class="chat-btn" style="display:none;">delete room</button>
                    </div>
                </div>
                <div id="callPanel" class="call-panel" style="display:none;">
                    <div id="callParticipants" class="call-participants"></div>
                    <div class="call-media-grid">
                        <div id="localMediaCard" class="call-media-card" style="display:none;">
                            <div class="call-media-label">you</div>
                            <video id="localCallVideo" autoplay playsinline muted></video>
                        </div>
                        <div id="remoteMediaGrid" class="call-media-grid"></div>
                    </div>
                </div>
                <div id="pinnedPanel" class="pinned-panel" style="display:none;"></div>

        function escapeHtml(text) {
            return String(text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');

        function formatStamp(ms) {
            if (!ms) return '';
            try {
                return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } catch {
                return '';
            }
        }

        function formatLastSeen(ms) {
            const stamp = Number(ms || 0);
            if (!stamp) return 'last seen: unknown';
            const delta = Date.now() - stamp;
            if (delta < 0) return 'last seen: just now';
            if (delta < 60 * 1000) return 'last seen: just now';
            if (delta < 60 * 60 * 1000) return `last seen: ${Math.max(1, Math.floor(delta / 60000))}m ago`;
            if (delta < 24 * 60 * 60 * 1000) return `last seen: ${Math.max(1, Math.floor(delta / 3600000))}h ago`;
            return `last seen: ${Math.max(1, Math.floor(delta / 86400000))}d ago`;
        }

        function normalizeRoomName(value) {
            return String(value || '')
                .trim()
                .toLowerCase()
                .replace(/[^a-z0-9 _-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')

        async function openProfileModal(targetUserId, targetUsername = '') {
            const userId = String(targetUserId || '').trim();
            const username = String(targetUsername || '').trim();
            if (!userId || !username) return;
            try {
                const payload = await apiRequest(`/api/profile/${encodeURIComponent(username)}`);
                state.profileTarget = {
                    userId,
                    username,
                    profile: payload?.profile || null,
                };
                renderProfileModal(state.profileTarget.profile || null);
                if (profileModalBackdropEl) {
                    profileModalBackdropEl.classList.add('active');
                    profileModalBackdropEl.setAttribute('aria-hidden', 'false');
                }
            } catch (error) {
                activeRoomMetaEl.textContent = error.message || 'profile load failed';
            }
        }

        function displayUserWithMode(message) {
            const username = String(message?.username || 'user');

        function normalizeUserStatus(value) {
            const status = String(value || '').toLowerCase();
            if (status === 'online' || status === 'idle' || status === 'dnd' || status === 'offline') return status;

        }

        function getReactionSet(message) {
            const rows = Array.isArray(message?.reactions) ? message.reactions : [];
            const out = new Map();
            for (const entry of rows) {

                if (!emoji) continue;
                out.set(emoji, {
                    emoji,
                    count: Number(entry?.count || 0),
                    me: !!entry?.me,

            return out;

        }

        function getActiveRoom() {

        function clearCallTimers() {
            if (state.call.stateTimer) clearInterval(state.call.stateTimer);
            if (state.call.signalTimer) clearInterval(state.call.signalTimer);
            if (state.call.pingTimer) clearInterval(state.call.pingTimer);
            state.call.stateTimer = null;
            state.call.signalTimer = null;
            state.call.pingTimer = null;
        }

        function stopLocalCallStream() {
            if (!state.call.localStream) return;
            state.call.localStream.getTracks().forEach((track) => track.stop());
            state.call.localStream = null;
            if (localCallVideoEl) localCallVideoEl.srcObject = null;
            if (localMediaCardEl) localMediaCardEl.style.display = 'none';
        }

        function removeRemoteMediaCard(peerId) {
            if (!remoteMediaGridEl) return;
            const targetId = String(peerId || '');
            const card = Array.from(remoteMediaGridEl.querySelectorAll('[data-peer-id]'))
                .find((entry) => String(entry.getAttribute('data-peer-id') || '') === targetId);
            if (card) card.remove();
        }

        function closePeerConnection(peerId) {
            const entry = state.call.peers[String(peerId || '')];
            if (!entry) return;
            try {
                if (entry.pc) entry.pc.close();
            } catch {
            }
            delete state.call.peers[String(peerId || '')];
            removeRemoteMediaCard(peerId);
        }

        function teardownCallUi() {
            Object.keys(state.call.peers).forEach((peerId) => closePeerConnection(peerId));
            stopLocalCallStream();
            if (callPanelEl) callPanelEl.style.display = 'none';
            if (callParticipantsEl) callParticipantsEl.textContent = '';
            if (remoteMediaGridEl) remoteMediaGridEl.innerHTML = '';
            state.call.active = false;
            state.call.roomId = '';
            state.call.mode = 'voice';
            state.call.since = 0;
            syncCallUi(getActiveRoom());
        }

        function syncCallUi(room) {
            const activeCallInThisRoom = state.call.active && room && state.call.roomId === room.id;
            if (voiceCallBtn) voiceCallBtn.style.display = activeCallInThisRoom ? 'none' : '';
            if (videoCallBtn) videoCallBtn.style.display = (!activeCallInThisRoom && isDmRoom(room)) ? '' : 'none';
            if (leaveCallBtn) leaveCallBtn.style.display = activeCallInThisRoom ? '' : 'none';
            if (callMetaEl) {
                if (!activeCallInThisRoom) {
                    callMetaEl.textContent = '';
                } else {
                    const peerCount = Object.keys(state.call.peers).length;
                    callMetaEl.textContent = `${state.call.mode} call active | ${peerCount + 1} in call`;
                }
            }
        }

        function ensureRemoteMediaCard(peerId, username = 'user') {
            if (!remoteMediaGridEl) return null;
            const targetId = String(peerId || '');
            let card = Array.from(remoteMediaGridEl.querySelectorAll('[data-peer-id]'))
                .find((entry) => String(entry.getAttribute('data-peer-id') || '') === targetId);
            if (card) return card;
            card = document.createElement('div');
            card.className = 'call-media-card';
            card.setAttribute('data-peer-id', targetId);
            card.innerHTML = `
                <div class="call-media-label">${escapeHtml(username)}</div>
                <video autoplay playsinline></video>
            `;
            remoteMediaGridEl.appendChild(card);
            return card;
        }

        async function sendCallSignal(toUserId, type, payload) {
            if (!state.call.active) return;
            const room = getActiveRoom();
            if (!room || room.id !== state.call.roomId) return;
            await apiRequest('/api/chat/call/signal', {
                method: 'POST',
                body: JSON.stringify({
                    room: room.id,
                    toUserId: String(toUserId || ''),
                    type: String(type || ''),
                    payload: payload || null,
                }),
            });
        }

        function ensurePeerConnection(peerId, username = 'user') {
            const id = String(peerId || '');
            if (!id) return null;
            if (state.call.peers[id]) return state.call.peers[id];

            const pc = new RTCPeerConnection({
                iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }],
            });

            const entry = {
                id,
                username: String(username || 'user'),
                pc,
                offered: false,
            };
            state.call.peers[id] = entry;

            if (state.call.localStream) {
                state.call.localStream.getTracks().forEach((track) => {
                    pc.addTrack(track, state.call.localStream);
                });
            }

            pc.onicecandidate = (event) => {
                if (!event.candidate) return;
                sendCallSignal(id, 'ice', { candidate: event.candidate }).catch(() => {});
            };

            pc.ontrack = (event) => {
                const stream = event.streams && event.streams[0] ? event.streams[0] : null;
                if (!stream) return;
                const card = ensureRemoteMediaCard(id, entry.username);
                const video = card ? card.querySelector('video') : null;
                if (video) video.srcObject = stream;
            };

            pc.onconnectionstatechange = () => {
                if (['closed', 'failed', 'disconnected'].includes(String(pc.connectionState || ''))) {
                    closePeerConnection(id);
                    syncCallUi(getActiveRoom());
                }
            };

            return entry;
        }

        async function maybeOfferPeer(peerId, force = false) {
            const id = String(peerId || '');
            if (!id || !state.call.active) return;
            if (!force && String(state.me?.id || '') >= id) return;
            const peer = ensurePeerConnection(id);
            if (!peer || peer.offered) return;
            peer.offered = true;
            try {
                const offer = await peer.pc.createOffer();
                await peer.pc.setLocalDescription(offer);
                await sendCallSignal(id, 'offer', {
                    sdp: peer.pc.localDescription,
                    video: state.call.mode === 'video',
                });
            } catch {
                peer.offered = false;
            }
        }

        async function handleCallSignal(signal) {
            if (!signal || typeof signal !== 'object') return;
            const fromUserId = String(signal.fromUserId || '');
            if (!fromUserId) return;
            const type = String(signal.type || '');
            const payload = signal.payload || null;
            const peer = ensurePeerConnection(fromUserId, signal.fromUsername || 'user');
            if (!peer) return;

            if (type === 'offer' && payload?.sdp) {
                await peer.pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
                const answer = await peer.pc.createAnswer();
                await peer.pc.setLocalDescription(answer);
                await sendCallSignal(fromUserId, 'answer', { sdp: peer.pc.localDescription });
                return;
            }
            if (type === 'answer' && payload?.sdp) {
                await peer.pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
                return;
            }
            if (type === 'ice' && payload?.candidate) {
                try {
                    await peer.pc.addIceCandidate(payload.candidate);
                } catch {
                }
                return;
            }
            if (type === 'hangup') {
                closePeerConnection(fromUserId);
            }
        }

        async function pollCallState() {
            if (!state.call.active) return;
            const room = getActiveRoom();
            if (!room || room.id !== state.call.roomId) return;
            try {
                const params = new URLSearchParams({ room: room.id });
                const password = getRoomPassword(room);
                if (password) params.set('password', password);
                const payload = await apiRequest(`/api/chat/call/state?${params.toString()}`);
                const call = payload?.call;
                if (!call || !call.active) return;
                state.call.mode = call.mode === 'video' ? 'video' : 'voice';
                const members = Array.isArray(call.members) ? call.members : [];
                const keepIds = new Set();
                for (const member of members) {
                    const peerId = String(member?.userId || '');
                    if (!peerId || peerId === String(state.me?.id || '')) continue;
                    keepIds.add(peerId);
                    ensurePeerConnection(peerId, member.username || 'user');
                    await maybeOfferPeer(peerId);
                }
                Object.keys(state.call.peers).forEach((peerId) => {
                    if (!keepIds.has(peerId)) closePeerConnection(peerId);
                });
                if (callParticipantsEl) {
                    const names = members.map((entry) => String(entry.username || 'user')).join(', ');
                    callParticipantsEl.textContent = names
                        ? `in call: ${names}`
                        : 'connecting call...';
                }
                if (callPanelEl) callPanelEl.style.display = '';
                syncCallUi(room);
            } catch {
            }
        }

        async function pollCallSignals() {
            if (!state.call.active) return;
            const room = getActiveRoom();
            if (!room || room.id !== state.call.roomId) return;
            try {
                const params = new URLSearchParams({
                    room: room.id,
                    since: String(state.call.since || 0),
                });
                const payload = await apiRequest(`/api/chat/call/signals?${params.toString()}`);
                const signals = Array.isArray(payload?.signals) ? payload.signals : [];
                for (const signal of signals) {
                    const createdAt = Number(signal?.createdAt || 0);
                    if (createdAt > state.call.since) state.call.since = createdAt;
                    await handleCallSignal(signal);
                }
            } catch {
            }
        }

        async function pingCall() {
            if (!state.call.active) return;
            const room = getActiveRoom();
            if (!room || room.id !== state.call.roomId) return;
            try {
                await apiRequest('/api/chat/call/ping', {
                    method: 'POST',
                    body: JSON.stringify({ room: room.id }),
                });
            } catch {
            }
        }

        function startCallPolling() {
            clearCallTimers();
            state.call.stateTimer = setInterval(() => { pollCallState(); }, 2200);
            state.call.signalTimer = setInterval(() => { pollCallSignals(); }, 900);
            state.call.pingTimer = setInterval(() => { pingCall(); }, 12000);
        }

        async function startCall({ video = false } = {}) {
            const room = getActiveRoom();
            if (!room) return;
            if (!window.RTCPeerConnection || !navigator.mediaDevices?.getUserMedia) {
                callMetaEl.textContent = 'voice/video calls are not supported in this browser';
                return;
            }
            if (state.call.active && state.call.roomId && state.call.roomId !== room.id) {
                await leaveCall();
            }
            if (state.call.active && state.call.roomId === room.id) return;
            const wantsVideo = Boolean(video) && isDmRoom(room);
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: wantsVideo,
                });
                state.call.localStream = stream;
                if (localCallVideoEl) localCallVideoEl.srcObject = wantsVideo ? stream : null;
                if (localMediaCardEl) localMediaCardEl.style.display = wantsVideo ? '' : 'none';
                const payload = await apiRequest('/api/chat/call/join', {
                    method: 'POST',
                    body: JSON.stringify({
                        room: room.id,
                        password: getRoomPassword(room) || '',
                        video: wantsVideo,
                        clientMode: getClientMode(),
                    }),
                });
                state.call.active = true;
                state.call.roomId = room.id;
                state.call.mode = payload?.call?.mode === 'video' ? 'video' : 'voice';
                state.call.since = 0;
                if (callPanelEl) callPanelEl.style.display = '';
                if (isDmRoom(room) && room.dmPeerUserId) {
                    ensurePeerConnection(room.dmPeerUserId, room.dmPeerUsername || 'user');
                    await maybeOfferPeer(room.dmPeerUserId, true);
                }
                startCallPolling();
                await pollCallState();
                syncCallUi(room);
            } catch (error) {
                stopLocalCallStream();
                callMetaEl.textContent = error?.message || 'call start failed';
            }
        }

        async function leaveCall() {
            if (!state.call.active && !state.call.roomId) return;
            const roomId = state.call.roomId;
            const peerIds = Object.keys(state.call.peers);
            for (const peerId of peerIds) {
                try {
                    await sendCallSignal(peerId, 'hangup', {});
                } catch {
                }
            }
            try {
                if (roomId) {
                    await apiRequest('/api/chat/call/leave', {
                        method: 'POST',
                        body: JSON.stringify({ room: roomId }),
                    });
                }
            } catch {
            }
            clearCallTimers();
            teardownCallUi();
        }

        async function apiRequest(url, options = {}) {
            const res = await fetch(url, {
                credentials: 'include',
                headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
                ...options,
            });
            let payload = null;
            try {
                payload = await res.json();
            } catch {
                payload = null;
            }
            if (!res.ok) {
                const error = new Error(payload && payload.error ? payload.error : `request failed (${res.status})`);
                error.status = res.status;
                throw error;
            }
            return payload;
        }

        async function requireAuth() {
            try {
                const cachedAuthPromise = window.__riftAuthMeCacheV1?.promise;
                let me = cachedAuthPromise ? await cachedAuthPromise : null;
                if (!me) me = await window.RiftAuth.me();
                if (!me.authenticated) {
                    location.href = '/account';
                    return false;
                }
                state.me = me.user || null;
                return true;
            } catch {
                location.href = '/account';
                return false;
            }
        }

        function canDeleteRoom(room) {
            if (!room || room.id === 'lobby' || room.id === 'links' || !state.me) return false;
            if (isDmRoom(room)) return false;
            const meUsername = String(state.me.username || '').toLowerCase();
            if (meUsername === 'rift') return true;
            return room.ownerUsername === state.me.username;
        }

        function isRiftAdminClient() {
            return String(state.me?.username || '').toLowerCase() === 'rift';
        }

        function syncDeleteButton(room) {
            if (canDeleteRoom(room)) {
                deleteRoomBtn.style.display = '';
                return;
            }
            deleteRoomBtn.style.display = 'none';
        }

        function getRoomPassword(room) {
            if (!room || !room.isPrivate) return '';
            return state.knownRoomPasswords[room.id] || '';
        }

        function clearRoomPassword(roomId) {
            delete state.knownRoomPasswords[roomId];
        }

        async function openDmWithUser(targetUserId, targetUsername = '', options = {}) {
            const userId = String(targetUserId || '').trim();
            if (!userId || String(state.me?.id || '') === userId) return;
            const shouldSelect = options && options.select === false ? false : true;
            try {
                const payload = await apiRequest('/api/chat/dm', {
                    method: 'POST',
                    body: JSON.stringify({
                        targetUserId: userId,
                        targetUsername: String(targetUsername || '').trim(),
                    }),
                });
                const room = payload?.room;
                if (!room || !room.id) return;
                await fetchRooms();
                if (shouldSelect) {
                    await selectRoom(room.id);
                }
                return room;
            } catch (error) {
                activeRoomMetaEl.textContent = error.message || 'failed to open direct message';
                return null;
            }
        }

        function normalizeFriendUsername(value) {
            return String(value || '')
                .trim()
                .toLowerCase()
                .replace(/^@+/g, '')
                .replace(/[^a-z0-9_]/g, '')
                .slice(0, 24);
        }

        async function fetchFriends() {
            try {
                const payload = await apiRequest('/api/chat/friends');
                state.friends = Array.isArray(payload?.friends) ? payload.friends : [];
                state.blockedUsers = Array.isArray(payload?.blocked) ? payload.blocked : [];
                renderFriends();
            } catch (error) {
                setFriendStatus(error?.message || 'friend list failed');
            }
        }

        async function updateFriend(action, targetUserId, targetUsername = '') {
            const payload = await apiRequest('/api/chat/friends', {
                method: 'POST',
                body: JSON.stringify({
                    action: String(action || ''),
                    targetUserId: String(targetUserId || '').trim(),
                    targetUsername: String(targetUsername || '').trim(),
                }),
            });
            state.friends = Array.isArray(payload?.friends) ? payload.friends : [];
            state.blockedUsers = Array.isArray(payload?.blocked) ? payload.blocked : [];
            renderFriends();
            return payload;
        }

        async function inviteFriendToActiveRoom(targetUserId, targetUsername = '') {
            const room = getActiveRoom();
            if (!room || !room.id) {
                setFriendStatus('select a room first');
                return;
            }
            const dmRoom = await openDmWithUser(targetUserId, targetUsername, { select: false });
            if (!dmRoom || !dmRoom.id) return;
            const url = new URL('/chat', window.location.origin);
            url.searchParams.set('room', String(room.id || ''));
            if (getClientMode() === 'nova') url.searchParams.set('rx', 'nova');
            const inviteText = room.isPrivate
                ? `join me in ${displayRoomName(room)} (private room - ask for password): ${url.toString()}`
                : `join me in ${displayRoomName(room)}: ${url.toString()}`;
            try {
                await apiRequest('/api/chat/messages', {
                    method: 'POST',
                    body: JSON.stringify({
                        room: dmRoom.id,
                        text: inviteText,
                        clientMode: getClientMode(),
                    }),
                });
                setFriendStatus(`invite sent to ${String(targetUsername || 'friend')}`);
            } catch (error) {
                setFriendStatus(error?.message || 'invite failed');
            }
        }

        function renderFriends() {

                } else {
                    friendListEl.innerHTML = state.friends.map((row) => {

                        return `
                            <article class="presence-item">
                                <div class="presence-head">
                                    <div class="presence-name">
                                        <span class="status-dot ${status}"></span>
                                        <span>${escapeHtml(username)}</span>
                                    </div>
                                    <div class="presence-meta">${escapeHtml(status)}</div>
                                </div>
                                <div class="presence-meta">${escapeHtml(lastSeen)}</div>
                                <div class="presence-actions">
                                    <button type="button" class="presence-btn" data-friend-dm="${escapeHtml(userId)}" data-friend-name="${escapeHtml(username)}">dm</button>
                                    <button type="button" class="presence-btn" data-friend-invite="${escapeHtml(userId)}" data-friend-name="${escapeHtml(username)}">invite</button>
                                    <button type="button" class="presence-btn" data-friend-remove="${escapeHtml(userId)}" data-friend-name="${escapeHtml(username)}">remove</button>
                                    <button type="button" class="presence-btn danger" data-friend-block="${escapeHtml(userId)}" data-friend-name="${escapeHtml(username)}">block</button>

                    friendListEl.querySelectorAll('[data-friend-dm]').forEach((button) => {

                    friendListEl.querySelectorAll('[data-friend-invite]').forEach((button) => {
                        button.addEventListener('click', async () => {
                            const targetUserId = String(button.getAttribute('data-friend-invite') || '');
                            const targetUsername = String(button.getAttribute('data-friend-name') || '');
                            await inviteFriendToActiveRoom(targetUserId, targetUsername);
                        });
                    });
                    friendListEl.querySelectorAll('[data-friend-remove]').forEach((button) => {
                        button.addEventListener('click', async () => {
                            const targetUserId = String(button.getAttribute('data-friend-remove') || '');
                            const targetUsername = String(button.getAttribute('data-friend-name') || '');
                            try {
                                await updateFriend('remove', targetUserId, targetUsername);

                            } catch (error) {
                                setFriendStatus(error?.message || 'remove failed');
                            }
                        });
                    });
                    friendListEl.querySelectorAll('[data-friend-block]').forEach((button) => {
                        button.addEventListener('click', async () => {
                            const targetUserId = String(button.getAttribute('data-friend-block') || '');
                            const targetUsername = String(button.getAttribute('data-friend-name') || '');
                            try {
                                await updateFriend('block', targetUserId, targetUsername);
                                setFriendStatus(`blocked ${targetUsername}`);
                            } catch (error) {
                                setFriendStatus(error?.message || 'block failed');
                            }
                        });
                    });
                }
            }

            if (blockedListEl) {
                if (!state.blockedUsers.length) {
                    blockedListEl.innerHTML = `<div class="room-empty">no blocked users</div>`;
                } else {
                    blockedListEl.innerHTML = state.blockedUsers.map((row) => {
                        const userId = String(row?.userId || '');
                        const username = String(row?.username || 'user');
                        return `
                            <article class="presence-item">
                                <div class="presence-head">
                                    <div class="presence-name"><span>${escapeHtml(username)}</span></div>
                                    <div class="presence-meta">blocked</div>
                                </div>
                                <div class="presence-actions">
                                    <button type="button" class="presence-btn" data-friend-unblock="${escapeHtml(userId)}" data-friend-name="${escapeHtml(username)}">unblock</button>
                                </div>
                            </article>
                        `;
                    }).join('');
                    blockedListEl.querySelectorAll('[data-friend-unblock]').forEach((button) => {
                        button.addEventListener('click', async () => {
                            const targetUserId = String(button.getAttribute('data-friend-unblock') || '');
                            const targetUsername = String(button.getAttribute('data-friend-name') || '');
                            try {
                                await updateFriend('unblock', targetUserId, targetUsername);
                                setFriendStatus(`unblocked ${targetUsername}`);
                            } catch (error) {
                                setFriendStatus(error?.message || 'unblock failed');
                            }
                        });

        function renderDmPresence(dmRooms) {
            if (!dmPresenceListEl) return;
            const rows = Array.isArray(dmRooms) ? dmRooms : [];
            if (!rows.length) {
                dmPresenceListEl.innerHTML = `<div class="room-empty">no dm presence yet</div>`;
                return;
            }
            dmPresenceListEl.innerHTML = rows.map((room) => {
                const peerId = String(room.dmPeerUserId || '');
                const peerName = String(room.dmPeerUsername || room.name || 'user');
                const status = normalizeUserStatus(room.dmPeerStatus);
                const lastSeen = formatLastSeen(room.dmPeerLastSeenAt);
                return `
                    <article class="presence-item" data-presence-room="${escapeHtml(room.id || '')}">
                        <div class="presence-head">
                            <div class="presence-name">
                                <span class="status-dot ${status}"></span>
                                <span>${escapeHtml(peerName)}</span>
                            </div>
                            <div class="presence-meta">${escapeHtml(status)}</div>
                        </div>
                        <div class="presence-meta">${escapeHtml(lastSeen)}</div>
                        <div class="presence-actions">
                            <button type="button" class="presence-btn" data-presence-open="${escapeHtml(room.id || '')}">open dm</button>
                            <button type="button" class="presence-btn" data-presence-voice="${escapeHtml(room.id || '')}" data-presence-peer="${escapeHtml(peerId)}">voice</button>

                        </div>

                    await selectRoom(roomId);
                });

            dmPresenceListEl.querySelectorAll('[data-presence-voice]').forEach((button) => {
                button.addEventListener('click', async () => {
                    const roomId = String(button.getAttribute('data-presence-voice') || '');
                    if (!roomId) return;
                    await selectRoom(roomId);
                    await startCall({ video: false });
                });

            dmPresenceListEl.querySelectorAll('[data-presence-video]').forEach((button) => {
                button.addEventListener('click', async () => {
                    const roomId = String(button.getAttribute('data-presence-video') || '');
                    if (!roomId) return;
                    await selectRoom(roomId);
                    await startCall({ video: true });
                });

        function renderRooms() {
            function bindRoomList(targetEl, rooms, emptyText) {
                if (!targetEl) return;
                if (!rooms.length) {
                    targetEl.innerHTML = `<div class="room-empty">${escapeHtml(emptyText)}</div>`;
                    return;
                }
                targetEl.innerHTML = rooms.map((room) => {
                    const isActive = room.id === state.activeRoomId;
                    const roomIcon = isDmRoom(room) ? 'alternate_email' : (room.isPrivate ? 'lock' : 'public');
                    const stamp = formatStamp(room.lastMessageAt || room.createdAt);
                    const roomName = isDmRoom(room) ? (room.dmPeerUsername || room.name || 'direct-message') : room.name;
                    const roomInfo = isDmRoom(room)
                        ? 'direct message'
                        : `owner: ${escapeHtml(room.ownerUsername || 'unknown')}`;
                    return `
                        <button type="button" class="room-item ${isActive ? 'active' : ''}" data-room-id="${escapeHtml(room.id)}">
                            <div class="room-name"><span class="material-icons">${roomIcon}</span>${isDmRoom(room) ? '@' : '#'} ${escapeHtml(roomName)}</div>
                            <div class="room-meta">${roomInfo} ${stamp ? `| last: ${escapeHtml(stamp)}` : ''}</div>
                        </button>
                    `;
                }).join('');
                targetEl.querySelectorAll('.room-item').forEach((button) => {
                    button.addEventListener('click', () => {
                        const roomId = button.getAttribute('data-room-id');
                        selectRoom(roomId);
                    });
                });
            }

            const dmRooms = state.rooms.filter((room) => isDmRoom(room));
            const chatRooms = state.rooms.filter((room) => !isDmRoom(room));
            bindRoomList(roomListRoomsEl, chatRooms, 'no chatrooms yet');
            bindRoomList(roomListDmsEl, dmRooms, 'no dms yet');
            renderDmPresence(dmRooms);
        }

        function setActiveRoomHeader(room) {
            if (!room) {
                activeRoomNameEl.textContent = '# lobby';
                activeRoomMetaEl.textContent = 'select a room to chat';
                syncDeleteButton(null);
                syncCallUi(null);
                renderPinnedPanel();
                renderTypingIndicator('');
                return;
            }
            activeRoomNameEl.textContent = displayRoomName(room);
            if (isDmRoom(room)) {
                activeRoomMetaEl.textContent = 'direct message';
            } else {
                activeRoomMetaEl.textContent = room.isPrivate ? 'private room' : 'public room';
            }
            syncDeleteButton(room);
            syncCallUi(room);
            renderPinnedPanel(room.id);
            renderTypingIndicator(room.id);
        }

        function renderPinnedPanel(roomId = state.activeRoomId) {
            if (!pinnedPanelEl) return;
            const pins = Array.isArray(state.pinsByRoom[roomId]) ? state.pinsByRoom[roomId] : [];
            const canPin = !!state.canPinByRoom[roomId];
            if (!pins.length) {
                pinnedPanelEl.style.display = 'none';
                pinnedPanelEl.innerHTML = '';
                return;
            }
            pinnedPanelEl.style.display = '';
            pinnedPanelEl.innerHTML = `
                <div class="pinned-title">pinned messages</div>
                <div class="pinned-list">
                    ${pins.map((msg) => `
                        <article class="pinned-item">
                            <div class="pinned-meta">
                                <span>${renderUserWithStatus(msg)} | ${escapeHtml(formatStamp(msg.createdAt))}</span>
                                ${canPin ? `<button type="button" class="presence-btn" data-unpin-id="${escapeHtml(msg.id || '')}">unpin</button>` : ''}
                            </div>
                            <div class="pinned-text">${escapeHtml(msg.text || '')}</div>
                        </article>
                    `).join('')}
                </div>
            `;
            if (canPin) {
                pinnedPanelEl.querySelectorAll('[data-unpin-id]').forEach((button) => {
                    button.addEventListener('click', async () => {
                        const messageId = String(button.getAttribute('data-unpin-id') || '');
                        await updatePinState(messageId, 'unpin');
                    });
                });
            }
        }

        function renderTypingIndicator(roomId = state.activeRoomId) {
            if (!typingIndicatorEl) return;
            const rows = Array.isArray(state.typingByRoom?.[roomId]) ? state.typingByRoom[roomId] : [];
            if (!rows.length) {
                typingIndicatorEl.textContent = '';
                return;
            }
            const names = rows.map((entry) => String(entry.username || 'user'));
            if (names.length === 1) {
                typingIndicatorEl.textContent = `${names[0]} is typing...`;
                return;
            }
            if (names.length === 2) {
                typingIndicatorEl.textContent = `${names[0]} and ${names[1]} are typing...`;
                return;
            }
            typingIndicatorEl.textContent = 'a few people are typing...';
        }

        function renderMessageReactions(msg) {
            const merged = getReactionSet(msg);
            ['👍', '❤️', '😂', '🔥', '😮', '😢'].forEach((emoji) => {
                if (!merged.has(emoji)) merged.set(emoji, { emoji, count: 0, me: false });
            });
            const ordered = Array.from(merged.values());
            return `
                <div class="message-reactions">
                    ${ordered.map((entry) => {
                        const emoji = String(entry.emoji || '');
                        const count = Number(entry.count || 0);
                        const classes = `message-reaction ${entry.me ? 'me' : ''} ${count <= 0 ? 'quick' : ''}`.trim();
                        return `<button type="button" class="${classes}" data-react-id="${escapeHtml(msg.id || '')}" data-react-emoji="${escapeHtml(emoji)}">${escapeHtml(emoji)} ${count > 0 ? count : ''}</button>`;
                    }).join('')}
                </div>
            `;
        }

        function appendMessages(messages) {
            if (!Array.isArray(messages) || !messages.length) return;
            const roomId = state.activeRoomId;
            const index = getRoomMessageIndex(roomId);
            for (const message of messages) {
                if (message && message.id) index[message.id] = message;
            }
            const html = messages.map((msg) => `
                <article class="message">
                    ${msg.replyTo ? `
                        <div class="message-reply-preview">
                            <div class="message-reply-author">${renderUserWithStatus(msg.replyTo)}</div>
                            <div>${escapeHtml(msg.replyTo.text || '')}</div>
                        </div>
                    ` : ''}
                    <div class="message-meta">
                        ${(state.me && String(msg.userId || '') !== String(state.me.id || ''))
                            ? `<button type="button" class="message-user message-user-btn" data-dm-user-id="${escapeHtml(msg.userId || '')}" data-dm-username="${escapeHtml(msg.username || 'user')}">${renderUserWithStatus(msg)}</button>`
                            : `<span class="message-user">${renderUserWithStatus(msg)}</span>`

                    <div class="message-text">${escapeHtml(msg.text || '')}</div>

                                ${Array.isArray(state.pinsByRoom[roomId]) && state.pinsByRoom[roomId].some((entry) => String(entry?.id || '') === String(msg.id || '')) ? 'unpin' : 'pin'}
                            </button>
