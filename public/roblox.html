<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rift Roblox</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: Arial, sans-serif;
        }

        #cloud-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #000;
        }
    </style>
</head>
<body>
    <iframe id="cloud-frame" title="Rift Roblox Cloud"></iframe>

    <script src="/register-sw.js"></script>
    <script src="/baremux/index.js"></script>
    <script>
        (async () => {
            const frame = document.getElementById('cloud-frame');
            const defaultTarget = 'https://nowgg.fun/apps/a/19900/b.html';
            const target = String(new URLSearchParams(window.location.search).get('url') || defaultTarget).trim() || defaultTarget;
            const resetKey = 'rift__roblox-idb-reset-v1';
            const loadScript = (src) => new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => resolve();
                script.onerror = () => reject(new Error(`failed to load ${src}`));
                document.head.appendChild(script);
            });
            const connection = window.BareMux?.BareMuxConnection
                ? new BareMux.BareMuxConnection('/baremux/worker.js')
                : null;

            const ensureTransport = async () => {
                if (!connection) {
                    throw new Error('BareMux is unavailable.');
                }

                const wispUrl =
                    (location.protocol === 'https:' ? 'wss' : 'ws') +
                    '://' +
                    location.host +
                    '/wisp/';

                await connection.setTransport('/libcurl/index.mjs', [
                    { websocket: wispUrl },
                ]);
            };

            try {
                if (!sessionStorage.getItem(resetKey) && typeof indexedDB !== 'undefined') {
                    const names = new Set(['$scramjet', 'scramjet', '$bare-mux', 'bare-mux', 'baremux']);
                    if (typeof indexedDB.databases === 'function') {
                        const databases = await indexedDB.databases();
                        for (const row of databases || []) {
                            const name = String(row?.name || '').trim();
                            if (!name) continue;
                            if (/scramjet|bare-?mux|mercury/i.test(name)) {
                                names.add(name);
                            }
                        }
                    }

                    await Promise.all(Array.from(names).map((name) => new Promise((resolve) => {
                        try {
                            const request = indexedDB.deleteDatabase(name);
                            request.onsuccess = () => resolve();
                            request.onerror = () => resolve();
                            request.onblocked = () => resolve();
                        } catch {
                            resolve();
                        }
                    })));

                    try {
                        localStorage.removeItem('bare-mux-path');
                    } catch {
                    }

                    sessionStorage.setItem(resetKey, '1');
                }
            } catch (error) {
                console.warn('[rift-roblox] state reset skipped', error);
            }

            if (typeof registerSW === 'function') {
                await registerSW();
            }

            await ensureTransport();
            await loadScript('/global/js/official-scramjet-config.js');

            const configFactory = self.__createRiftScramjetConfig;
            const config = typeof configFactory === 'function' ? configFactory() : null;
            if (!config) {
                throw new Error('official scramjet config is missing');
            }

            self.__scramjet$config = config;
            await loadScript('/scramjet/scramjet.all.js');

            const { ScramjetController } = self.$scramjetLoadController();
            const controller = new ScramjetController(config);
            await controller.init();

            frame.src = controller.encodeUrl(target);
        })().catch((error) => {
            console.error('[rift-roblox] failed to start', error);
        });
    </script>
    <script src="/config.js"></script>
    <script src="/global/js/ads.js"></script>
</body>
</html>
